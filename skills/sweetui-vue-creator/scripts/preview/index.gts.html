<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UX Prototype Preview</title>

    <!-- ═══ 1. 本地运行时（FIXED — 勿改勿删勿换 CDN）═══
         加载顺序即依赖顺序（探针 5.1 证实）：SweetUI UMD 需要预置
         window.Vue / window.xss / window._$1(lodash) / window.echarts；
         UMD 顶层是 CJS wrapper，全局名为 window["sweet-ui-base"]。
         ⚠ 只加载 sweet-ui-base.css（含 :root 变量默认值）——
         theme-chalk/vars/var-ui-*.css 禁止引入（同在 body[theme]
         作用域定义 --el-*/--swt-*，会与 src/assets/themes/bridge.less
         抢级联，后加载者赢）。 -->
    <script src="./public/library/vue.global.prod.js"></script>
    <script src="./public/library/xss.js"></script>
    <script src="./public/library/lodash.min.js"></script>
    <script>window._$1 = window._;</script>
    <script src="./public/library/echarts.min.js"></script>
    <script src="./public/library/sweet-ui-base.umd.cjs"></script>
    <script src="./public/library/less.min.js"></script>
    <script src="./public/library/vue3-sfc-loader.js"></script>
    <link rel="stylesheet" href="./public/library/sweet-ui-base.css">

    <!-- ═══ 2. 主题（样式文件即交付件，位于 src/assets/themes/*.less）═══
         主题不走 <link>：file:// 下浏览器拦截 less 的 XHR 取源，改由下方 boot
         阶段用已入场的 less.min.js 对 preview-data.js 里的源文本 less.render
         编译后注入（与 SFC <style lang="less"> 同一编译器）。themes/ 下所有
         .less 自动发现加载，新皮肤放入即生效，无需注册。
         皮肤作用域是 body[theme="<皮肤名>"]（SweetUI 原生机制），不是
         html[data-theme]。 -->

    <!-- ═══ 3. 页面骨架样式（FIXED）═══ -->
    <style>
        html, body, #app { height: 100%; margin: 0; padding: 0; }
        body {
            font-family: var(--font-family);
            background: var(--color-bg-1);
            color: var(--color-text-primary);
        }
        #ux-boot-error {
            display: none;
            margin: 24px auto;
            max-width: 720px;
            padding: 12px 16px;
            font-size: 13px;
            white-space: pre-wrap;
            color: var(--color-error, #e02128);
            background: #fee7e8;
            border: 1px solid #f59297;
            border-radius: 8px;
        }
    </style>
</head>
<body theme="default">
    <div id="app"></div>
    <pre id="ux-boot-error"></pre>

    <!-- 源码映射（由 build-data.mjs / build.mjs 从 src/ 自动生成）-->
    <script src="./preview-data.js"></script>

    <script>
        // ═══ 预览加载器（FIXED — 勿改）═══
        // .vue 源码来自 window.__UX_PROTO_SRC__（src/ 的打包映射），由 vue3-sfc-loader
        // 在浏览器内现场编译 — 与真实 Vite 工程同一套代码，无需构建步骤。
        // 换肤 = SweetUI 原生 setTheme（等价 body.setAttribute("theme", name)）。
        window.setTheme = (name) => {
            document.body.setAttribute("theme", name);
        };

        (function () {
            var bootError = document.getElementById("ux-boot-error");
            function showBootError(msg) {
                bootError.textContent = "预览加载失败：" + msg;
                bootError.style.display = "block";
            }
            window.addEventListener("error", function (e) { showBootError(e.message); });

            if (!window.__UX_PROTO_SRC__) {
                showBootError("preview-data.js 缺失或为空 — 运行 node scripts/build.mjs --dir 重新生成");
                return;
            }

            var SweetUIBase = window["sweet-ui-base"];

            var ASSET_EXT = [".png", ".jpg", ".jpeg", ".gif", ".svg", ".webp", ".ico", ".bmp"];
            var SRC = window.__UX_PROTO_SRC__;

            function addStyle(textContent) {
                var style = document.createElement("style");
                style.textContent = textContent;
                document.head.appendChild(style);
            }

            var options = {
                moduleCache: Object.assign(Object.create(null), {
                    vue: Vue,
                    "@hw-seq/sweet-ui-base": SweetUIBase,
                    dayjs: dayjs,
                    echarts: echarts,
                    less: less,
                }),
                getFile: function (path) {
                    var clean = String(path).split("?")[0].split("#")[0];
                    if (ASSET_EXT.some(function (ext) { return clean.endsWith(ext); })) {
                        var assetExt = clean.slice(clean.lastIndexOf("."));
                        return Promise.resolve({ getContentData: function () { return ""; }, type: assetExt });
                    }
                    var content = SRC[clean];
                    if (content === undefined) {
                        return Promise.reject(new Error("源码映射中找不到 " + clean + " — 修改 src/ 后请重跑 build"));
                    }
                    // 剥 BOM：Windows 编辑器常写入 EF BB BF，会毒化 CSS 首条选择器 / JSON.parse
                    if (content.charCodeAt(0) === 0xfeff) content = content.slice(1);
                    // 类型取自真实扩展名；.js 按 .mjs 处理 —— sfc-loader 只对 .mjs 走 ESM 解析，
                    // 而 Vite 语义中 src/ 下 .js 本就是 ESM，此处映射使预览与真实工程一致
                    var type = clean.slice(clean.lastIndexOf("."));
                    if (type === ".js") type = ".mjs";
                    // 契约要求 getContentData 返回 Promise（部分调用链直接 .then）
                    return Promise.resolve({ getContentData: function () { return Promise.resolve(content); }, type: type });
                },
                handleModule: function (type, getContentData, path) {
                    if (type === ".css") {
                        return Promise.resolve(getContentData()).then(addStyle).then(function () { return {}; });
                    }
                    if (type === ".less") {
                        // 组件显式 import 的 .less；主题 themes/*.less 走上方 boot 注入通道，不经此处
                        return Promise.resolve(getContentData())
                            .then(function (text) { return less.render(String(text)); })
                            .then(function (out) { addStyle(out.css); })
                            .then(function () { return {}; });
                    }
                    if (type === ".json") {
                        // ESM 语义：default import 拿到解析后的对象（剥 BOM —— Windows 编辑器常带）
                        return Promise.resolve(getContentData()).then(function (text) {
                            var parsed = JSON.parse(String(text).replace(/^﻿/, ""));
                            return { default: parsed, __esModule: true };
                        });
                    }
                    if (ASSET_EXT.indexOf(type) !== -1) {
                        // 返回相对预览根的 URL（真实工程中 import 资源同样得到 URL，语义一致）
                        return Promise.resolve("." + String(path).split("?")[0]);
                    }
                    // 注意：必须返回 undefined（不是 null）才会走 loader 对 .vue/.js 的默认编译处理
                    return undefined;
                },
                addStyle: function (styleStr) { addStyle(styleStr); },
                log: function (type) {
                    if (type === "error") {
                        var args = Array.prototype.slice.call(arguments, 1);
                        showBootError(args.map(String).join(" "));
                        console.error.apply(console, args);
                    }
                },
            };

            // 主题先行：themes/ 下全部 .less 在挂载前经 less.render 编译注入（与 SFC
            // <style lang="less"> 同一编译器），避免无主题闪屏。file:// 下 less 无法
            // 自行 XHR 取源，故从 preview-data.js 的源码映射取文本。base/bridge 先于
            // 皮肤由字母序天然满足，皮肤间按 body[theme] 分域互不依赖。
            var THEME_DIR = "/src/assets/themes/";
            var themePaths = Object.keys(SRC)
                .filter(function (p) { return p.indexOf(THEME_DIR) === 0 && p.slice(-5) === ".less"; })
                .sort();
            Promise.all(themePaths.map(function (p) {
                return less.render(SRC[p]).then(function (out) { addStyle(out.css); });
            })).then(function () {
                // icon-plus barrel: if /src/assets/icons/index.js exists (fetch-icons
                // output), pre-load it and expose it as the "icon-barrel" module so
                // icon-plus.vue resolves company SVGs; names absent from the barrel
                // fall back to the SweetUI font icon inside the wrapper.
                var barrelSrc = SRC["/src/assets/icons/index.js"];
                var initPromise;
                if (barrelSrc) {
                    initPromise = window["vue3-sfc-loader"].loadModule("/src/assets/icons/index.js", options)
                        .then(function (barrel) {
                            options.moduleCache["icon-barrel"] = barrel;
                        })
                        .catch(function (e) {
                            console.warn("[ux-proto] icon barrel failed, all icon-plus fall back to SW font icons:", e);
                        });
                } else {
                    initPromise = Promise.resolve();
                }

                return initPromise;
            }).then(function () {
                var app = Vue.createApp({
                    components: {
                        UxRoot: Vue.defineAsyncComponent(function () {
                            return window["vue3-sfc-loader"].loadModule("/src/App.vue", options);
                        }),
                    },
                    template: "<UxRoot />",
                });
                // 注册方式（整体 app.use vs 逐组件）为内网首个实跑项（HANDOFF H-1）；
                // 默认走整体注册。UxRoot 内以 <sweet-config-provider :locale> 提供文案。
                if (SweetUIBase && typeof SweetUIBase.install === "function") {
                    app.use(SweetUIBase);
                } else if (SweetUIBase) {
                    for (var k in SweetUIBase) {
                        if (/^Sweet[A-Z]/.test(k) && SweetUIBase[k]) app.component(SweetUIBase[k].name, SweetUIBase[k]);
                    }
                }
                if (window.SweetUIBaseI18n) app.use(window.SweetUIBaseI18n);
                app.mount("#app");
            }).catch(function (e) {
                showBootError("主题编译失败：" + ((e && e.message) || e));
            });
        })();
    </script>
</body>
</html>
