<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>__ID__ · 组件创作</title>
<style>
/* editor-tokens:start */
.edit-scope {
  --ed-panel: rgba(255, 255, 255, 0.97);
  --ed-input: #f4f5f7;
  --ed-input-hover: #e4e6ea;
  --ed-border: rgba(0, 0, 0, 0.08);
  --ed-text: #1d1f23;
  --ed-dim: #6b7280;
  --ed-accent: #3d7eff;
  --ed-accent-soft: rgba(61, 126, 255, 0.12);
  --ed-danger: #e5484d;
  --ed-shadow: 0 4px 20px rgba(24, 39, 64, 0.06);
  --ed-radius: 10px;
  --ed-radius-s: 6px;
}
/* editor-tokens:end */
*{box-sizing:border-box}body{margin:0;background:#eef1f5;color:var(--ed-text);font:13px system-ui,-apple-system,"Segoe UI",sans-serif;height:100dvh;overflow:hidden}
#view{position:absolute;inset:0 334px 0 0;min-width:0}canvas{display:block}body.panel-collapsed #view{right:0}
#panel{position:absolute;top:14px;bottom:14px;right:14px;width:306px;background:var(--ed-panel);border:1px solid var(--ed-border);border-radius:var(--ed-radius);box-shadow:var(--ed-shadow);display:flex;flex-direction:column;overflow:hidden}
header{padding:16px;border-bottom:1px solid var(--ed-border)}h1{font-size:15px;margin:0 0 6px;overflow-wrap:anywhere}small{color:var(--ed-dim)}.panel-content{padding:0 16px 16px;overflow:auto;flex:1;min-height:0}
label{display:block;margin:20px 0;color:var(--ed-dim);font-size:12px}label input{display:block;margin-top:9px;max-width:100%}input[type=range]{width:100%;accent-color:var(--ed-accent)}input[type=color]{width:40px;height:28px;border:1px solid var(--ed-border);border-radius:var(--ed-radius-s);background:var(--ed-input);cursor:pointer}input[type=file]{width:100%;font-size:12px}
input:focus-visible,button:focus-visible,summary:focus-visible{outline:2px solid var(--ed-accent);outline-offset:3px}output{float:right;font-variant-numeric:tabular-nums;color:var(--ed-text)}
button{border:0;border-radius:var(--ed-radius-s);padding:7px 10px;font:inherit;font-size:12px;background:var(--ed-input);color:var(--ed-text);cursor:pointer}button:hover:not(:disabled){background:var(--ed-input-hover)}button:disabled{opacity:.35;cursor:default}.primary{background:var(--ed-accent);color:white}.primary:hover:not(:disabled){background:#558fff}.buttons{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}#actions{display:flex;gap:8px;flex-wrap:wrap}#actions:empty{display:none}#toggle-panel{float:right;margin-left:8px}#open-panel{position:absolute;right:14px;top:14px;z-index:2}#status{font-size:12px;color:var(--ed-dim);line-height:1.6;overflow-wrap:anywhere}details{border-top:1px solid var(--ed-border);padding-top:12px;color:var(--ed-dim);font-size:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;font-size:11px}[hidden]{display:none!important}
@media(max-width:720px){#view{right:0}#panel{width:min(306px,calc(100vw - 28px));z-index:1}header{padding:12px}.panel-content{padding:0 12px 12px}}
</style></head>
<body class="edit-scope"><main id="view" aria-label="组件三维预览"></main><button id="open-panel" aria-controls="panel" aria-expanded="false" hidden>参数</button>
<aside id="panel" aria-label="组件参数"><header><button id="toggle-panel" aria-controls="panel" aria-expanded="true">收起</button><h1>__ID__</h1><small>组件参数 · 独立候选</small></header><div class="panel-content"><div id="controls"></div><div id="actions"></div><div class="buttons"><button id="reset">恢复默认</button><button class="primary" id="export">导出演示工程</button></div><label>导入同版本参数<input id="import" type="file" accept=".zip"></label><p id="status" role="status">正在加载组件…</p><details><summary>运行状态</summary><pre id="state"></pre></details></div></aside>
<script>addEventListener('error',e=>{document.getElementById('status').textContent='启动失败：'+e.message});addEventListener('unhandledrejection',e=>{document.getElementById('status').textContent='启动失败：'+(e.reason?.message||e.reason)});</script><script type="module" src="main.mjs"></script></body></html>
