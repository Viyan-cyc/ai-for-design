<!doctype html>
<html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>G Design · 色块装饰</title>
<link rel="stylesheet" href="../assets/g-design-enterprise-v1.5.0/frontend/element-plus/tokens/primitive.css">
<link rel="stylesheet" href="../assets/g-design-enterprise-v1.5.0/frontend/element-plus/tokens/semantic-light.css">
<link rel="stylesheet" href="../assets/g-design-enterprise-v1.5.0/frontend/element-plus/tokens/semantic-dark.css">
<link rel="stylesheet" href="../assets/g-design-enterprise-v1.5.0/frontend/element-plus/tokens/glass.css">
<style>body{margin:0;padding:32px;font:14px/22px var(--font-family-zh);background:var(--color-bg-1);color:var(--color-text-primary)}header{display:flex;align-items:center;gap:16px;margin-bottom:24px}h1{font-size:20px}button{font:inherit;padding:6px 12px;color:inherit;background:var(--color-bg-5);border:1px solid var(--color-border);border-radius:var(--radius-normal);cursor:pointer}button:focus-visible{outline:2px solid var(--color-border-focus);outline-offset:2px}.cards{display:flex;gap:16px;flex-wrap:wrap}.card{box-sizing:border-box;width:320px;min-height:140px;padding:20px;border-radius:var(--radius-medium);border:1px solid var(--color-border-separator)}.card:not([data-surface]){background:var(--color-bg-5)}h2{font-size:16px;margin:0 0 16px}.values{display:grid;grid-template-columns:1.2fr 1fr 1fr;gap:12px}.values strong{font:600 30px/38px var(--font-family-numeric);display:block}.values span{font-size:12px}.cards p{margin:0;color:var(--color-text-secondary)}@media(max-width:400px){body{padding:16px}.card{width:100%}}</style></head>
<body><header><h1>重点卡片与普通卡片</h1><button id="theme" type="button">切换主题</button></header><div class="cards">
<section class="card" data-surface="brand" data-decoration="frosted"><h2>全部事件</h2><div class="values"><div><strong>24</strong><span>事件总数</span></div><div><strong>17</strong><span>待处理</span></div><div><strong>7</strong><span>已完成</span></div></div></section>
<section class="card"><h2>服务请求</h2><div class="values"><div><strong>5</strong><span>请求总数</span></div><div><strong>2</strong><span>处理中</span></div><div><strong>3</strong><span>已完成</span></div></div></section>
</div><script>document.getElementById('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};</script></body></html>
