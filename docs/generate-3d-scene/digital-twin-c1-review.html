<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>C1 面板条件预览</title><style>
body{margin:0;background:#eef0f3;color:#1d1f23;font:14px system-ui}header{padding:20px;background:white}button,select{padding:8px;border:0;border-radius:6px;background:#f4f5f7;margin:4px}button{cursor:pointer}.active{color:#3d7eff;background:#e7efff}main{display:grid;grid-template-columns:210px 1fr 330px;gap:20px;padding:20px}.panel{background:white;border:1px solid #ddd;border-radius:10px;padding:16px}section{padding:14px 0;border-bottom:1px solid #eee}h3{font-size:14px;color:#6b7280}p{line-height:1.7;color:#6b7280}label{display:inline-block;margin:6px}input{width:90px;padding:7px;border:0;background:#f4f5f7}footer{padding:20px}#center{min-height:300px}details{margin:12px}table{border-collapse:collapse;background:white}td,th{padding:10px;border:1px solid #ddd;text-align:left}@media(max-width:850px){main{grid-template-columns:1fr}.panel{width:auto}}</style>
<header><b>C1 面板条件预览 · 设计示意，非生产编辑器</b><p>只检查显示条件与归属。下面的场景设置没有接入3D，也不保存。</p>
<label>宿主<select id="host"><option value="plain">普通场景（工厂/室内等）</option><option value="map">地图场景</option></select></label>
<label>选中<select id="target"><option value="none">无选中</option><option value="three">Three对象</option><option value="building">地图建筑</option><option value="water">地图水面</option></select></label>
<label><input type="checkbox" id="locked">锁定</label>
<label>投影<select id="projection"><option value="perspective">透视</option><option value="orthographic">正交</option></select></label>
<label><input type="checkbox" id="visible" checked>建筑显示</label><label><input type="checkbox" id="shadow" checked>建筑支持投影</label>
</header><main><aside class="panel">模型　灯光　统计<p>模型列表保持现有结构<br>眼睛、锁与真实子节点<br>不添加虚构分类</p></aside><article id="center"><div class="panel">顶部：保存 · 撤销 · 重做 · 导入（现有唯一入口）</div><h2>场景视口区域</h2><p>本页没有3D场景。请切换上方条件，再查看右侧物体/场景页。</p><p id="explain"></p><div class="panel">底部：俯视 · 鸟瞰 · 浅色 · 深色 · 网格 · 世界坐标 · 专注显示</div></article><aside class="panel"><button id="object">物体</button><button id="scene">场景</button><div id="content"></div></aside></main><details><summary>全部规则与现有/提案状态</summary><div id="rules"></div></details><footer>下一步：C2术语；C3焦距；C4实际显示规则。待确认功能未加入。</footer>
<script>const catalog={"scope": "C1设计，非生产面板", "rules": [{"id": "quality", "title": "画质与性能", "placement": "场景", "condition": "全部宿主", "behavior": "沿用现有档位和高级参数；地图参数作用范围保留说明。", "status": "现有", "source": "RenderSettings.vue"}, {"id": "environment", "title": "场景风格、背景、环境、雾", "placement": "场景", "condition": "普通场景", "behavior": "地图不显示普通场景环境；雾启用后才显示雾参数。", "status": "现有", "source": "PropertyPanel.vue"}, {"id": "camera", "title": "相机", "placement": "场景", "condition": "普通场景", "behavior": "透视显示FOV；正交隐藏FOV。近面/远面改名在C2；焦距在C3。", "status": "现有结构；投影条件待C4核对", "source": "PropertyPanel.vue"}, {"id": "controls", "title": "控制器", "placement": "场景", "condition": "普通场景", "behavior": "自动旋转开启后显示转速；阻尼开启后显示系数。", "status": "现有", "source": "PropertyPanel.vue"}, {"id": "lights", "title": "灯光", "placement": "场景", "condition": "全部宿主", "behavior": "地图内灯光仅影响附加Three模型，不控制底图建筑光影；保留无灯光时添加入口。按灯类型显示参数。", "status": "现有入口；作用域文案为提案", "source": "PropertyPanel.vue"}, {"id": "transform", "title": "变换", "placement": "物体", "condition": "选中Three对象", "behavior": "锁定时禁用；地图内附加Three模型同样适用。地图表面不显示XYZ变换。", "status": "现有", "source": "PropertyPanel.vue"}, {"id": "material", "title": "材质", "placement": "物体", "condition": "选中Three对象/材质槽", "behavior": "按实际材质支持项显示；不把IOR、透射等强加到全部材质。多选材质策略保持现有，待C4核对。", "status": "现有入口；逐属性条件待C4", "source": "MaterialParams.vue"}, {"id": "surface", "title": "图层外观", "placement": "物体", "condition": "选中地图表面", "behavior": "显隐、支持时颜色；建筑支持投影时显示投影开关。锁定禁用编辑；关闭建筑显示时投影控件禁用。", "status": "现有", "source": "PropertyPanel.vue"}, {"id": "viewport", "title": "俯视、鸟瞰、浅色、深色", "placement": "底部工具", "condition": "全部宿主", "behavior": "普通场景俯视保留投影类型，深浅目前改背景/雾；地图俯视切view，深浅切主题，不能宣称完全相同效果。", "status": "现有", "source": "ViewportTools.vue"}, {"id": "save", "title": "保存、撤销、重做、导入", "placement": "顶部工具", "condition": "编辑模式", "behavior": "沿用唯一保存与撤销入口；不新增高级窗保存或模板保存按钮。具体重置整理留C5。", "status": "现有", "source": "Toolbar.vue"}, {"id": "tree", "title": "模型、灯光、统计", "placement": "左侧面板", "condition": "编辑模式", "behavior": "地图表面和Three模型仍在模型列表；保留眼睛/锁，不虚构子节点。", "status": "现有", "source": "OutlineTree.vue"}], "sources": [{"path": "D:\\cyc\\project\\octo\\gts\\test\\ep-coder\\skills\\generate-3d-scene\\template\\src\\edit\\MaterialParams.vue", "sha256": "3dcd869df3ccc4deab2963c0e96912ba5aa82259b578b41f9ffd2d67d1712c01"}, {"path": "D:\\cyc\\project\\octo\\gts\\test\\ep-coder\\skills\\generate-3d-scene\\template\\src\\edit\\OutlineTree.vue", "sha256": "820db9b2939d22d90af13cfc74f15177ae2f602b28bee2b26dc16d6a56b87701"}, {"path": "D:\\cyc\\project\\octo\\gts\\test\\ep-coder\\skills\\generate-3d-scene\\template\\src\\edit\\PropertyPanel.vue", "sha256": "6becb3cf2bcfcc260b4fed17b2fa83b59c0bb379f23148e384b3dd02ccdcef01"}, {"path": "D:\\cyc\\project\\octo\\gts\\test\\ep-coder\\skills\\generate-3d-scene\\template\\src\\edit\\RenderSettings.vue", "sha256": "eab31d8098ae18fc15d323dfd29a92c5a78ea3a67f00cd967a43bb24933abf46"}, {"path": "D:\\cyc\\project\\octo\\gts\\test\\ep-coder\\skills\\generate-3d-scene\\template\\src\\edit\\Toolbar.vue", "sha256": "a2b4fb56637d83eabb03f4739d334d097ca5f1f9169dbbaa5f28a1865049aadc"}, {"path": "D:\\cyc\\project\\octo\\gts\\test\\ep-coder\\skills\\generate-3d-scene\\template\\src\\edit\\ViewportTools.vue", "sha256": "9619536b3f938fe66d08c159292a4b00402127823dc2c7428840b67e0f28a6c8"}, {"path": "D:\\cyc\\project\\octo\\gts\\test\\ep-coder\\skills\\generate-3d-scene\\template\\src\\edit\\styles\\editor.css", "sha256": "2325bda036444ad61738f81690b8178b85c6630df8b9f94f8b316b3eb04d0749"}]};let tab='scene';const $=id=>document.getElementById(id);function block(id,title,text){return `<section data-rule="${id}"><h3>${title}</h3><p>${text}</p></section>`}function render(){const map=$('host').value==='map';for(const o of $('target').options)o.disabled=!map&&['building','water'].includes(o.value);if(!map&&['building','water'].includes($('target').value))$('target').value='none';const t=$('target').value,l=$('locked').checked;let s='';$('projection').disabled=map;$('visible').disabled=t!=='building';$('shadow').disabled=t!=='building';$('locked').disabled=t==='none';if(tab==='scene'){s+=block('quality','画质与性能','流畅 / 均衡 / 精细；高级设置沿用现有。'+(map?'地图与附加模型的参数作用范围分别说明。':''));if(!map){s+=block('environment','场景风格 / 场景','背景、环境、雾；雾参数按启用条件显示。');s+=block('camera','相机',$('projection').value==='perspective'?'位置 / 视点 / FOV / 近面 / 远面。焦距在C3实现。':'位置 / 视点 / 近面 / 远面。FOV不显示。');s+=block('controls','控制器','自动旋转 → 转速；阻尼 → 系数。');}s+=block('lights','灯光',map?'仅控制附加Three模型；不改变地图底图建筑光影。保留添加灯光。':'现有灯光列表及添加入口；按灯光类型显示参数。');}else if(t==='none'){s=block('empty','未选中物体','请在视口或模型列表选择对象。');}else{if(l)s+='<p>对象已锁定，请在模型列表解锁后修改。</p>';if(t==='three'){s+=block('transform','变换','位置 / 旋转 / 缩放');s+=block('material','物体与材质','显隐、投影、受影；按实际材质支持项显示。');}else{s+=block('surface',t==='building'?'建筑':'水面','显示 / 支持时颜色'+(t==='building'&&$('shadow').checked?' / 显示投影':'')+'；无Three材质和XYZ变换。');if(t==='building'&&$('shadow').checked)s+=`<button id="projection-toggle" disabled>${!$('visible').checked?'投影不可编辑：建筑已隐藏':l?'投影不可编辑：对象已锁定':'显示投影（示意控件）'}</button>`;}s+=`<fieldset disabled><legend>${l?'锁定：不可编辑':'属性示意：未接入运行时'}</legend><input aria-label="示意数值" value="—"></fieldset>`;}$('content').innerHTML=s;$('object').className=tab==='object'?'active':'';$('scene').className=tab==='scene'?'active':'';$('explain').textContent=map?'地图俯视是view切换；深浅切换地图主题。':'普通俯视保留投影类型；深浅目前调整背景与雾，不代表全材质主题。';}for(const id of ['host','target','locked','projection','visible','shadow'])$(id).onchange=render;for(const id of ['object','scene'])$(id).onclick=()=>{tab=id;render()};$('rules').innerHTML='<table><tr><th>设置</th><th>位置</th><th>条件</th><th>行为</th><th>状态</th></tr>'+catalog.rules.map(r=>'<tr>'+['title','placement','condition','behavior','status'].map(k=>'<td>'+r[k]+'</td>').join('')+'</tr>').join('')+'</table>';render();</script></html>
