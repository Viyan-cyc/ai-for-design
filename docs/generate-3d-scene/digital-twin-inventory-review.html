on, visualization]\n    dependsOn: []\n    map:\n      \"1:1km\": { worldUnit: km, sceneMetersPerUnit: 1000 }\n      \"1:1m\": { worldUnit: m, sceneMetersPerUnit: 1 }\n      \"1:1cm\": { worldUnit: cm, sceneMetersPerUnit: 0.01 }\n      \"1:1mm\": { worldUnit: mm, sceneMetersPerUnit: 0.001 }"}, {"id": "space.container.sceneMetersPerUnit", "label": "场景单位米制换算", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:33", "raw": "  - id: space.container.sceneMetersPerUnit\n    label: 场景单位米制换算\n    path: foundation.sceneMetersPerUnit\n    tier: basic\n    type: number\n    unit: m/unit\n    default: 1\n    recommended: 1\n    derivedFrom: space.container.length\n    note: 由 Length 档写入；勿单独另写一套"}, {"id": "space.container.gridMajorMm", "label": "网格主格 mm", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:44", "raw": "  - id: space.container.gridMajorMm\n    label: 网格主格 mm\n    path: foundation.gridMajorMm\n    tier: basic\n    type: number\n    unit: mm\n    default: 1000\n    recommended: 1000\n    domainDefaults:\n      芯片: 10\n      GTS领域: 1000\n    recommendedNote: 芯片包对齐 demo 基线 10 mm 格；scaleAdaptGrid 保持关"}, {"id": "space.container.activeScaleLevelId", "label": "当前比例尺 L", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:57", "raw": "  - id: space.container.activeScaleLevelId\n    label: 当前比例尺 L\n    path: ui.scale.activeScaleLevelId\n    tier: basic\n    type: string\n    default: L19\n    domainDefaults:\n      芯片: L27\n      GTS领域: L15\n    recommendedNote: 芯片带空场景锚点 L27（1 cm）；GTS领域为约 200～500m 园区视距的 L15 锚点"}, {"id": "space.camera.focalLength", "label": "焦距 Focal Length", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:68", "raw": "  - id: space.camera.focalLength\n    label: 焦距 Focal Length\n    purpose: 设置默认视角\n    path: foundation.focalLengthMm\n    tier: basic\n    type: float\n    range: [18, 300]\n    unit: mm\n    panel: slider+text\n    default: 36\n    recommended:\n      scene: 36\n      singleObject: 50\n      chip: 80\n    domainDefaults:\n      GTS领域: 30\n    recommendedNote: 普适默认机位 36mm（场景档）；芯片档对齐路径检查 demo focalLengthMm=80；GTS领域按 AIDC 43° 垂直 FOV（24mm 传感器高）换算约 30mm\n    advanced: none\n    source: H Design（延用原定义）\n    details: 详情.md"}, {"id": "space.camera.sensorHeight", "label": "传感器高度 Sensor Height", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:89", "raw": "  - id: space.camera.sensorHeight\n    label: 传感器高度 Sensor Height\n    path: foundation.sensorHeightMm\n    tier: advanced\n    type: number\n    unit: mm\n    fieldRole: userInput\n    default: 24\n    recommended: 24\n    min: 1\n    max: 100\n    panel: text\n    note: Film Gate / 传感器高度；fov derive 的显式输入，默认 24 mm"}, {"id": "space.camera.fov", "label": "镜头垂直视场角", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:103", "raw": "  - id: space.camera.fov\n    label: 镜头垂直视场角\n    path: foundation.fov\n    tier: basic\n    type: number\n    unit: deg\n    fieldRole: derived\n    derivedFrom: space.camera.focalLength\n    derive:\n      fn: verticalFovFromFocalLength\n      inputs:\n        - foundation.focalLengthMm\n        - foundation.sensorHeightMm\n    agent: read_only\n    note: 由 focalLengthMm 与 sensorHeightMm（默认 24）换算；禁止隐含写死传感器高而不声明"}, {"id": "space.camera.verticalViewAngle", "label": "垂直视角 Vertical Field of View", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:119", "raw": "  - id: space.camera.verticalViewAngle\n    label: 垂直视角 Vertical Field of View\n    purpose: 设置默认视角\n    path: controls.polarDeg\n    tier: basic\n    type: float\n    range: [-90, 90]\n    unit: deg\n    panel: slider+text\n    default: 30\n    recommended:\n      scene: 30\n      singleObject: 45\n      chip: 15\n    domainDefaults:\n      GTS领域: 12.4\n    advanced: none\n    semantics: elevFromHorizon\n    source: H Design（延用原定义）\n    details: 详情.md"}, {"id": "space.camera.horizontalViewAngle", "label": "水平视角 Horizontal Field of View", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:140", "raw": "  - id: space.camera.horizontalViewAngle\n    label: 水平视角 Horizontal Field of View\n    purpose: 设置默认视角\n    path: controls.azimuthDeg\n    tier: basic\n    type: float\n    range: [-180, 180]\n    unit: deg\n    panel: slider+text\n    default: 150\n    recommended:\n      scene: 150\n      singleObject: 150\n      chip: 0\n    domainDefaults:\n      GTS领域: 32.5\n    recommendedNote: 芯片档 0° 为正面。FRONT=+Z，与 Step 3 前视同一约定；GTS领域将 AIDC 的 34.5° 基准加 −2° 偏移，得到绝对方位约 32.5°\n    advanced: none\n    source: H Design（延用原定义）\n    details: 详情.md"}, {"id": "space.camera.motionRadius", "label": "相机运动半径", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:161", "raw": "  - id: space.camera.motionRadius\n    label: 相机运动半径\n    purpose: 设置默认视角\n    path: controls.cameraMotionRadiusMode\n    tier: advanced\n    type: enum\n    enum: [fixed, scene]\n    labels:\n      fixed: 固定数值\n      scene: 场景\n    panel:\n      section: rules\n      group: 观察视角\n      order: 40\n    default: scene\n    recommended: scene\n    advanced: none\n    source: 场景规则（产品定义）\n    details: 详情.md"}, {"id": "space.camera.globalBrightness", "label": "全局亮度", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:181", "raw": "  - id: space.camera.globalBrightness\n    label: 全局亮度\n    path: foundation.globalBrightness\n    tier: basic\n    type: number\n    unit: ratio\n    default: 1.0"}, {"id": "space.lighting.type", "label": "灯光类型 Lighting Type", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:189", "raw": "  - id: space.lighting.type\n    label: 灯光类型 Lighting Type\n    purpose: 设置空间容器的光源\n    path: foundation.lightingTypes\n    tier: basic\n    type: enum[]\n    multi: true\n    default: [directional, area, environment]\n    recommended: [directional, area, environment]\n    enum: [point, directional, area, environment]\n    advanced: none\n    source: H Design（延用原定义）\n    details: 详情.md\n    labels:\n      point: 点光\n      directional: 平行光\n      area: 区域光\n      environment: 环境光（HDR）"}, {"id": "space.lighting.shadow", "    default:\n      directional: \"0-0-100\"\n      area: \"0-0-100\"\n      environment: \"0-0-100\"\n    recommended: null\n    advanced: string-hsv\n    source: 场景规则（产品定义）\n    details: 详情.md"}, {"id": "space.lighting.temperatureNightlight", "label": "色温（夜间）Temperature（Nightlight）", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:404", "raw": "  - id: space.lighting.temperatureNightlight\n    label: 色温（夜间）Temperature（Nightlight）\n    purpose: 设置空间容器的光源\n    path: foundation.lightingTemperatureNightlight\n    tier: advanced\n    type: float\n    range: [1000, 10000]\n    panel: slider\n    unit: K\n    condition:\n      path: foundation.nightlightMode\n      eq: true\n    default:\n      directional: 6500\n      area: 6500\n      environment: 4200\n    recommended: null\n    advanced: slider-1000-10000\n    source: 场景规则（产品定义）\n    details: 详情.md"}, {"id": "space.lighting.intensity", "label": "光源强度 Intensity", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:425", "raw": "  - id: space.lighting.intensity\n    label: 光源强度 Intensity\n    purpose: 设置空间容器的光源\n    path: foundation.lightingIntensity\n    tier: advanced\n    type: float\n    unit: ratio\n    range: [0, 100]\n    panel: slider\n    default:\n      directional: 1\n      area: 5\n      environment: 20\n    recommended:\n      directional: 1\n      area: 5\n      environment: 20\n    domainDefaults:\n      芯片: { directional: 8, area: 8, environment: 16 }\n    recommendedNote: 芯片按用户确认采用 8/8/16；区域光同步 keyIntensity=8，普适默认保持不变\n    advanced: slider-0-100\n    source: H Design（延用原定义）\n    details: 详情.md"}, {"id": "space.lighting.exposure", "label": "曝光 Exposure", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:449", "raw": "  - id: space.lighting.exposure\n    label: 曝光 Exposure\n    purpose: 设置空间容器的光源\n    path: foundation.lightingExposure\n    tier: advanced\n    type: float\n    range: [-10, 10]\n    panel: slider\n    unit: EV\n    default:\n      directional: 0\n      area: 0\n      environment: 0\n    recommended:\n      directional: 0\n      area: 0\n      environment: 0\n    advanced: slider--10-10\n    source: H Design（延用原定义）\n    details: 详情.md"}, {"id": "space.lighting.temperature", "label": "色温 Temperature", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:470", "raw": "  - id: space.lighting.temperature\n    label: 色温 Temperature\n    purpose: 设置空间容器的光源\n    path: foundation.lightingTemperature\n    tier: advanced\n    type: float\n    range: [1000, 10000]\n    panel: slider\n    unit: K\n    default:\n      directional: 6500\n      area: 6500\n      environment: 4200\n    recommended:\n      directional: 6500\n      area: 6500\n      environment: 4200\n    advanced: slider-1000-10000\n    source: H Design（延用原定义）\n    details: 详情.md"}, {"id": "space.lighting.colorHsv", "label": "色值 Color（HSV）", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:491", "raw": "  - id: space.lighting.colorHsv\n    label: 色值 Color（HSV）\n    purpose: 设置空间容器的光源\n    path: foundation.lightingColorHsv\n    tier: advanced\n    type: string\n    format: H-S-V\n    panel: text\n    default:\n      directional: \"0-0-100\"\n      area: \"0-0-100\"\n      environment: \"0-0-100\"\n    recommended:\n      directional: \"0-0-100\"\n      area: \"0-0-100\"\n      environment: \"0-0-100\"\n    advanced: string-hsv\n    source: H Design（延用原定义）\n    details: 详情.md"}, {"id": "space.lighting.keyIntensity", "label": "主光强度（引擎）", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:511", "raw": "  - id: space.lighting.keyIntensity\n    label: 主光强度（引擎）\n    path: foundation.keyIntensity\n    tier: advanced\n    type: number\n    unit: ratio\n    derivedFrom: space.lighting.intensity.area\n    note: 由区域光 Intensity 映射；勿与面板各写一套"}, {"id": "space.lighting.lightingMode", "label": "灯光模式", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:520", "raw": "  - id: space.lighting.lightingMode\n    label: 灯光模式\n    path: foundation.lightingMode\n    tier: basic\n    type: string\n    default: threePoint\n    derivedFrom: space.lighting.type\n    note: 由 Lighting Type 集合推导；勿单独另写一套"}, {"id": "space.lighting.recipeLock", "label": "配方锁定", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:529", "raw": "  - id: space.lighting.recipeLock\n    label: 配方锁定\n    path: ui.recipeLock\n    tier: advanced\n    type: string\n    default: room"}, {"id": "space.viewport.background", "label": "视口背景色", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:536", "raw": "  - id: space.viewport.background\n    label: 视口背景色\n    path: foundation.background\n    tier: advanced\n    type: string\n    default: \"#191919\"\n    domainDefaults:\n      芯片: \"#000000\"\n    recommendedNote: 对齐路径检查 demo 暗棚黑底"}, {"id": "space.viewport.environmentIntensity", "label": "环境贴图强度", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:546", "raw": "  - id: space.viewport.environmentIntensity\n    label: 环境贴图强度\n    path: foundation.environmentIntensity\n    tier: advanced\n    type: float\n    unit: ratio\n    range: [0, 1]\n    default: 0.2\n    domainDefaults:\n      芯片: 0.028\n    recommendedNote: 对齐 demo environmentIntensity；Three.js scene.environmentIntensity"}, {"id": "space.viewport.envMapIntensity", "label": "材质环境反射强度", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:558", "raw": "  - id: space.viewport.envMapIntensity\n    label: 材质环境反射强度\n    path: foundation.envMapIntensity\n    tier: advanced\n    type: float\n    unit: ratio\n    range: [0, 1]\n    default: 0.2\n    domainDefaults:\n      芯片: 0.06"}, {"id": "space.viewport.scaleLodMode", "label": "比例尺 LOD 模式", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:569", "raw": "  - id: space.viewport.scaleLodMode\n    label: 比例尺 LOD 模式\n    path: foundation.scaleLodMode\n    tier: advanced\n    type: enum\n    enum: [step, auto, manual]\n    default: auto\n    domainDefaults:\n      芯片: step\n    recommendedNote: 对齐 demo scaleLodMode=step（滚轮逐级 L）"}, {"id": "space.viewport.scaleAdaptGrid", "label": "随比例尺改网格", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:580", "raw": "  - id: space.viewport.scaleAdaptGrid\n    label: 随比例尺改网格\n    path: foundation.scaleAdaptGrid\n    tier: advanced\n    type: boolean\n    default: true\n    domainDefaults:\n      芯片: false\n    recommendedNote: demo 关，避免冲掉芯片 10mm 基线格"}, {"id": "space.viewport.motionBezier", "label": "运镜贝塞尔", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:590", "raw": "  - id: space.viewport.motionBezier\n    label: 运镜贝塞尔\n    path: foundation.motionBezier\n    tier: advanced\n    type: string\n    default: \"0.2,0,0.1,1\"\n    domainDefaults:\n      芯片: \"0.2,0,0.1,1\"\n    recommendedNote: demo cubic-bezier(0.2,0,0.1,1)；面板存逗号串，宿主自行拆成数组"}, {"id": "space.viewport.near", "label": "近裁剪面", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:600", "raw": "  - id: space.viewport.near\n    label: 近裁剪面\n    path: foundation.near\n    tier: advanced\n    type: float\n    unit: modelUnit\n    range: [0.001, 10]\n    default: 0.1\n    domainDefaults:\n      芯片: 0.01"}, {"id": "space.viewport.gridSubdivisions", "label": "网格细分", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:611", "raw": "  - id: space.viewport.gridSubdivisions\n    label: 网格细分\n    path: foundation.gridSubdivisions\n    tier: advanced\n    type: number\n    unit: count\n    min: 1\n    max: 20\n    default: 10\n    domainDefaults:\n      芯片: 1"}, {"id": "space.lighting.lightContrast", "label": "灯光反差", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:623", "raw": "  - id: space.lighting.lightContrast\n    label: 灯光反差\n    path: foundation.lightContrast\n    tier: advanced\n    type: enum\n    enum: [low, medium, high]\n    default: medium\n    domainDefaults:\n      芯片: low\n    recommendedNote: demo lightContrast=low → fill/rim 比例更高"}, {"id": "space.material.reflectiveMetalness", "label": "反射材质金属度", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:634", "raw": "  - id: space.material.reflectiveMetalness\n    label: 反射材质金属度\n    path: foundation.reflective.metalness\n    tier: advanced\n    type: float\n    unit: ratio\n    range: [0, 1]\n    default: 0.2\n    domainDefaults:\n      芯片: 0.08"}, {"id": "space.material.reflectiveRoughness", "label": "反射材质粗糙度", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:645", "raw": "  - id: space.material.reflectiveRoughness\n    label: 反射材质粗糙度\n    path: foundation.reflective.roughness\n    tier: advanced\n    type: float\n    unit: ratio\n    range: [0, 1]\n    default: 0.5\n    domainDefaults:\n      芯片: 0.78"}, {"id": "space.material.transparentIor", "label": "透明材质折射率", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:656", "raw": "  - id: space.material.transparentIor\n    label: 透明材质折射率\n    path: foundation.transparent.ior\n    tier: advanced\n    type: float\n    unit: ratio\n    range: [1, 3]\n    default: 1.5\n    domainDefaults:\n      芯片: 2"}, {"id": "space.material.transparentRoughness", "label": "透明材质粗糙度", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:667", "raw": "  - id: space.material.transparentRoughness\n    label: 透明材质粗糙度\n    path: foundation.transparent.roughness\n    tier: advanced\n    type: float\n    unit: ratio\n    range: [0, 1]\n    default: 0.5\n    domainDefaults:\n      芯片: 0.72"}, {"id": "space.render.qualityPreset", "label": "渲染品质", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:678", "raw": "  - id: space.render.qualityPreset\n    label: 渲染品质\n    purpose: 设置空间内模型渲染方式的规则\n    path: render.qualityPreset\n    tier: basic\n    type: enum\n    enum: [fluent, balanced, refined]\n    labels:\n      fluent: 流畅\n      balanced: 平衡\n      refined: 精致\n    panel:\n      section: rules\n      group: 渲染机制\n      order: 10\n    default: fluent\n    recommended: fluent\n    advanced: none\n    details: 详情.md"}, {"id": "space.render.lod", "label": "模型分级 Model LOD", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:698", "raw": "  - id: space.render.lod\n    label: 模型分级 Model LOD\n    purpose: 设置不同细节层级模型在空间容器中的展示方式\n    path: model.lod\n    tier: basic\n    type: enum\n    panel: array\n    default: mid\n    enum: [low, mid, high]\n    details: 详情.md\n    notes:\n      - \"唯一初值 mid。不另写 low/high\""}, {"id": "space.render.structureDetailMode", "label": "结构详略模式 Structure Detail Mode", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:711", "raw": "  - id: space.render.structureDetailMode\n    label: 结构详略模式 Structure Detail Mode\n    purpose: 设置不同细节层级模型在空间容器中的展示方式\n    path: ui.structureDetail.mode\n    tier: basic\n    type: enum\n    panel: array\n    default: cluster\n    enum: [cluster, unit]\n    details: 详情.md"}, {"id": "space.render.lodTier", "label": "穿层 LOD 档 LOD Tier", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:722", "raw": "  - id: space.render.lodTier\n    label: 穿层 LOD 档 LOD Tier\n    purpose: 设置不同细节层级模型在空间容器中的展示方式\n    path: ui.structureDetail.lodTier\n    tier: advanced\n    type: enum\n    panel: array\n    default: shell\n    enum: [shell, mid, detail]\n    details: 详情.md"}, {"id": "space.render.hideDoorInUnit", "label": "单机柜展示时隐藏柜门", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:733", "raw": "  - id: space.render.hideDoorInUnit\n    label: 单机柜展示时隐藏柜门\n    purpose: 设置不同细节层级模型在空间容器中的展示方式\n    path: ui.structureDetail.hideDoorInUnit\n    tier: basic\n    type: boolean\n    default: true\n    details: 详情.md"}, {"id": "space.render.modelNumber", "label": "空间内的模型数量 Model Number", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:742", "raw": "  - id: space.render.modelNumber\n    label: 空间内的模型数量 Model Number\n    purpose: 设置空间内模型渲染方式的规则\n    path: render.modelNumber.limit\n    tier: basic\n    type: float\n    range: [500, max]\n    unit: count\n    panel: slider+text\n    default: auto\n    recommended:\n      noGpu: 2000\n      gpu: max\n    advanced: none\n    details: 详情.md"}, {"id": "space.render.grayboxScenario", "label": "白模使用场景 Graybox Scenario（白模 On 时）", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:758", "raw": "  - id: space.render.grayboxScenario\n    label: 白模使用场景 Graybox Scenario（白模 On 时）\n    purpose: 设置空间内模型渲染方式的规则\n    path: render.grayboxModel.scenarios\n    tier: advanced\n    type: array\n    panel: multi-select\n    enum: [focus, unfocused]\n    labels:\n      focus: 聚焦\n      unfocused: 非聚焦\n    default: [unfocused]\n    recommended: [unfocused]\n    enableWhen:\n      path: render.grayboxModel.enabled\n      eq: true\n    basic: none\n    details: 详情.md"}, {"id": "space.render.dynamicModelDetail", "label": "动态渲染模型细节 Dynamic Rendering of Model Detail", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:777", "raw": "  - id: space.render.dynamicModelDetail\n    label: 动态渲染模型细节 Dynamic Rendering of Model Detail\n    purpose: 设置空间内模型渲染方式的规则\n    path: render.dynamicModelDetail.enabled\n    tier: basic\n    type: boolean\n    panel: toggle\n    default: true\n    recommended: true\n    advanced: none\n    details: 详情.md"}, {"id": "space.render.dynamicModelDetail.focalLod", "label": "模型细节层级 Level of Detail（Dynamic On 时）", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:789", "raw": "  - id: space.render.dynamicModelDetail.focalLod\n    label: 模型细节层级 Level of Detail（Dynamic On 时）\n    purpose: 设置空间内模型渲染方式的规则\n    path: render.dynamicModelDetail.focalBands\n    tier: advanced\n    type: array\n    panel: band-select\n    bands:\n      - id: near\n        focalMm: [80, 300]\n        fields: [focusLod, unfocusedLod]\n      - id: mid\n        focalMm: [36, 79]\n        fields: [focusLod, unfocusedLod]\n      - id: far\n        focalMm: [18, 35]\n        fields: [focusLod, unfocusedLod]\n    enum: [high, mid, low]\n    default:\n      near: { focusLod: high, unfocusedLod: high }\n      mid: { focusLod: mid, unfocusedLod: mid }\n      far: { focusLod: low, unfocusedLod: low }\n    recommended:\n      near: high\n      mid: mid\n      far: low\n    enableWhen:\n      path: render.dynamicModelDetail.enabled\n      eq: true\n    basic: none\n    note: 延用 H Design 定义；焦距与 foundation.focalLengthMm 对齐\n    details: 详情.md"}, {"id": "space.render.dataLayer", "label": "模型内容数据集 Data Layer", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:822", "raw": "  - id: space.render.dataLayer\n    label: 模型内容数据集 Data Layer\n    purpose: 设置空间内模型渲染方式的规则\n    path: render.dataLayer\n    tier: advanced\n    type: range\n    panel: slider\n    range: [L0, L43]\n    paths:\n      minLevelIndex: render.dataLayer.minLevelIndex\n      maxLevelIndex: render.dataLayer.maxLevelIndex\n    default:\n      minLevelIndex: 0\n      maxLevelIndex: 43\n    recommended: 按实际需求；默认全部开放 L0-L43\n    basic: none\n    details: 详情.md"}, {"id": "space.render.grayboxModel", "label": "白模模式 Graybox Model", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:840", "raw": "  - id: space.render.grayboxModel\n    label: 白模模式 Graybox Model\n    purpose: 设置空间内模型渲染方式的规则\n    path: render.grayboxModel.enabled\n    tier: basic\n    type: boolean\n    panel: toggle\n    default: true\n    recommended: true\n    advanced: none\n    details: 详情.md"}, {"id": "space.occlusion.highlightEdge", "label": "选中 X-ray 描边", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:852", "raw": "  - id: space.occlusion.highlightEdge\n    label: 选中 X-ray 描边\n    path: interaction.focus.showOutline\n    tier: basic\n    type: boolean\n    default: false"}, {"id": "space.blockage.method", "label": "遮挡策略 Blockage Method", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:859", "raw": "  - id: space.blockage.method\n    label: 遮挡策略 Blockage Method\n    purpose: 设置模型空间遮挡的呈现规则\n    path: render.occlusion.strategy\n    tier: basic\n    type: enum\n    panel: array\n    enum: [physical, perspective]\n    labels:\n      physical: 物理遮挡\n      perspective: 透视\n    default: physical\n    recommended:\n      mapLike: physical\n      monitorToolLike: perspective\n    domainDefaults:\n      芯片: perspective\n    recommendedNote: 芯片工具态用透视遮挡，对齐 monitorToolLike\n    advanced: none\n    migrate:\n      xray: perspective\n      ghost: perspective"}, {"id": "space.blockage.transparency", "label": "遮挡物透明度 Blockage Transparency", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:882", "raw": "  - id: space.blockage.transparency\n    label: 遮挡物透明度 Blockage Transparency\n    purpose: 设置模型空间遮挡的呈现规则\n    path: render.occlusion.blockageTransparency\n    tier: advanced\n    type: float\n    range: [0, 100]\n    unit: percent\n    panel: slider\n    default: 30\n    recommended: 30\n    showIf:\n      path: render.occlusion.strategy\n      eq: perspective\n    condition:\n      path: render.occlusion.strategy\n      eq: perspective\n    advanced: none"}, {"id": "space.blockage.ssao", "label": "环境光遮蔽 Ambient Occlusion", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:901", "raw": "  - id: space.blockage.ssao\n    label: 环境光遮蔽 Ambient Occlusion\n    purpose: 设置物理遮挡下的屏幕空间环境光遮蔽（SSAO）\n    path: render.occlusion.ssaoEnabled\n    tier: advanced\n    type: boolean\n    panel: checkbox\n    default: false\n    recommended: true\n    showIf:\n      path: render.occlusion.strategy\n      eq: physical\n    condition:\n      path: render.occlusion.strategy\n      eq: physical\n    advanced: none\n    note: 物理遮挡通用项；开启后在缝隙/接触面加深暗部，强化实体遮挡体量感"}, {"id": "space.blockage.ssaoRadius", "label": "遮蔽半径 AO Radius", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:919", "raw": "  - id: space.blockage.ssaoRadius\n    label: 遮蔽半径 AO Radius\n    purpose: 设置 SSAO 采样半径\n    unit: px\n    path: render.occlusion.ssaoRadius\n    tier: advanced\n    type: float\n    range: [1, 32]\n    panel: slider\n    default: 8\n    recommended: 8\n    showIf:\n      path: render.occlusion.strategy\n      eq: physical\n    condition:\n      path: render.occlusion.strategy\n      eq: physical\n    advanced: none"}, {"id": "space.blockage.ssaoIntensity", "label": "遮蔽强度 AO Intensity", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:938", "raw": "  - id: space.blockage.ssaoIntensity\n    label: 遮蔽强度 AO Intensity\n    purpose: 设置 SSAO 暗部强度\n    path: render.occlusion.ssaoIntensity\n    tier: advanced\n    type: float\n    range: [0, 200]\n    unit: percent\n    panel: slider\n    default: 100\n    recommended: 100\n    showIf:\n      path: render.occlusion.strategy\n      eq: physical\n    condition:\n      path: render.occlusion.strategy\n      eq: physical\n    advanced: none"}, {"id": "space.model.collision", "label": "碰撞 Collision", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:957", "raw": "  - id: space.model.collision\n    label: 碰撞 Collision\n    purpose: 设置模型的物理性质\n    path: model.collision.enabled\n    tier: basic\n    type: boolean\n    panel: checkbox\n    default: true\n    recommended: true\n    advanced: none"}, {"id": "space.model.collisionModelTypes", "label": "碰撞类型", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:968", "raw": "  - id: space.model.collisionModelTypes\n    label: 碰撞类型\n    purpose: 设置模型的物理性质\n    path: model.collision.modelTypes\n    tier: advanced\n    type: string_array\n    panel: multi_select\n    enum: [type1, type2, type3, type4]\n    labels:\n      type1: 类型1\n      type2: 类型2\n      type3: 类型3\n      type4: 类型4\n    default: [type1, type2, type3, type4]\n    recommended: [type1, type2, type3, type4]\n    note: 碰撞参与类型；可多选\n    advanced: none"}, {"id": "space.model.collisionVolume", "label": "碰撞体积 Collision Volume", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:986", "raw": "  - id: space.model.collisionVolume\n    label: 碰撞体积 Collision Volume\n    purpose: 设置模型的物理性质\n    path: model.collision.volumePercent\n    tier: advanced\n    type: float\n    range: [100, 200]\n    unit: percent\n    panel: slider\n    default: 100\n    recommended: 100\n    note: 开启后场景模型无法相互穿模，碰撞体积决定物体的热区范围\n    advanced: none"}, {"id": "space.blockage.highlightSilhouette", "label": "高亮被遮挡区域边缘 Highlight Blockage Silhouette", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:1000", "raw": "  - id: space.blockage.highlightSilhouette\n    label: 高亮被遮挡区域边缘 Highlight Blockage Silhouette\n    purpose: 设置模型空间遮挡的呈现规则\n    path: render.occlusion.highlightBlockageSilhouette\n    tier: advanced\n    type: boolean\n    panel: checkbox\n    default: false\n    recommended: false\n    showIf:\n      path: render.occlusion.strategy\n      eq: perspective\n    condition:\n      path: render.occlusion.strategy\n      eq: perspective\n    advanced: none"}, {"id": "space.lighting.environmentHour", "label": "环境时间", "group": "step-01-基础空间", "source": "step-01-基础空间/参数.yaml:1017", "raw": "  - id: space.lighting.environmentHour\n    label: 环境时间\n    path: foundation.environmentHour\n    type: float\n    unit: h\n    range: [0, 24]\n    tier: advanced\n    panel: slider\n    default: 12\n    recommended: 12\n    note: 时间因子作用于已绑定灯光；无灯光能力时不得报告成功"}, {"id": "import.layerMeta.matRole", "label": "材质角色", "group": "step-02-导入对象", "source": "step-02-导入对象/参数.yaml:5", "raw": "  - id: import.layerMeta.matRole\n    label: 材质角色\n    path: layerMeta.matRole\n    tier: basic\n    type: string\n    required: true"}, {"id": "import.layerMeta.matClass", "label": "物类", "group": "step-02-导入对象", "source": "step-02-导入对象/参数.yaml:12", "raw": "  - id: import.layerMeta.matClass\n    label: 物类\n    path: layerMeta.matClass\n    tier: basic\n    type: string\n    required: true"}, {"id": "import.layerMeta.selectable", "label": "可点选", "group": "step-02-导入对象", "source": "step-02-导入对象/参数.yaml:19", "raw": "  - id: import.layerMeta.selectable\n    label: 可点选\n    path: layerMeta.selectable\n    tier: basic\n    type: boolean\n    default: true"}, {"id": "import.preserveSource", "label": "1:1 保留源", "group": "step-02-导入对象", "source": "step-02-导入对象/参数.yaml:26", "raw": "  - id: import.preserveSource\n    label: 1:1 保留源\n    path: userData.preserveSource\n    tier: basic\n    type: boolean\n    default: true\n    notes:\n      - \"已有网格保持顶点与材质颜色。本字段只登记，不授权重搭\""}, {"id": "import.modelScale", "label": "整机显示缩放", "group": "step-02-导入对象", "source": "step-02-导入对象/参数.yaml:35", "raw": "  - id: import.modelScale\n    label: 整机显示缩放\n    path: foundation.modelScale\n    tier: basic\n    type: number\n    unit: ratio\n    default: 1\n    derivedFrom: space.container.sceneMetersPerUnit\n    notes:\n      - \"默认 1：不在 Step 1 比例尺之外再乘一套缩放。禁止再用 1.2\""}, {"id": "control.input.types", "label": "交互输入 Input Type", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:5", "raw": "  - id: control.input.types\n    label: 交互输入 Input Type\n    purpose: 设置基础交互行为\n    path: interaction.input.types\n    tier: basic\n    type: array\n    panel: multi-select\n    enum: [mouse, keyboard, touch]\n    labels:\n      mouse: 鼠标\n      keyboard: 键盘\n      touch: 触摸屏\n    default: [mouse, keyboard]\n    recommended: [mouse, keyboard]\n    advanced: none\n    details: 详情.md"}, {"id": "control.select.binding", "label": "选中 Select", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:22", "raw": "  - id: control.select.binding\n    label: 选中 Select\n    purpose: 设置基础交互行为\n    path: interaction.selectBinding\n    tier: basic\n    type: object\n    panel: mouse-select+text\n    paths:\n      mouse.left: interaction.selectBinding.mouse.left\n      mouse.middle: interaction.selectBinding.mouse.middle\n      mouse.right: interaction.selectBinding.mouse.right\n      keyboard: interaction.selectBinding.keyboard\n    enum:\n      mouse: [none, click, dblclick, longpress, scroll]\n    default:\n      mouse:\n        left: click\n        middle: none\n        right: none\n      keyboard: Ctrl+A\n      touch: tap\n    recommended:\n      mouse:\n        left: click\n      keyboard: Ctrl+A\n      touch: tap\n    advanced: none\n    details: 详情.md"}, {"id": "control.deselect.binding", "label": "取消选中 Deselect", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:51", "raw": "  - id: control.deselect.binding\n    label: 取消选中 Deselect\n    purpose: 设置基础交互行为\n    path: interaction.deselectBinding\n    tier: basic\n    type: object\n    panel: mouse-select+text\n    paths:\n      mouse.left: interaction.deselectBinding.mouse.left\n      mouse.middle: interaction.deselectBinding.mouse.middle\n      mouse.right: interaction.deselectBinding.mouse.right\n      keyboard: interaction.deselectBinding.keyboard\n    enum:\n      mouse: [none, click, dblclick, longpress, scroll]\n    default:\n      mouse:\n        left: none\n        middle: none\n        right: none\n      keyboard: Esc\n    recommended:\n      mouse:\n        left: none\n        middle: none\n        right: none\n      keyboard: Esc\n    advanced: none\n    details: 详情.md"}, {"id": "control.input.hover.enabled", "label": "允许悬浮 Allow Hover", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:80", "raw": "  - id: control.input.hover.enabled\n    label: 允许悬浮 Allow Hover\n    purpose: 设置基础交互行为\n    path: interaction.hover.enabled\n    tier: basic\n    type: boolean\n    panel: boolean\n    default: true\n    recommended: true\n    advanced: none\n    details: 详情.md\n    notes:\n      - \"普适与芯片场景初值都是 true。\""}, {"id": "control.pan.binding", "label": "拖动 Pan", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:94", "raw": "  - id: control.pan.binding\n    label: 拖动 Pan\n    purpose: 设置基础交互行为\n    path: interaction.panBinding\n    tier: basic\n    type: object\n    panel: mouse-select+text\n    paths:\n      mouse.left: interaction.panBinding.mouse.left\n      mouse.middle: interaction.panBinding.mouse.middle\n      mouse.right: interaction.panBinding.mouse.right\n      keyboard: interaction.panBinding.keyboard\n    enum:\n      mouse: [none, click, dblclick, longpress, scroll]\n    default:\n      mouse:\n        left: none\n        middle: none\n        right: longpress\n      keyboard: 无\n    recommended:\n      mouse:\n        right: longpress\n      keyboard: 无\n    advanced: none\n    details: 详情.md"}, {"id": "control.orbit.binding", "label": "旋转 Orbit", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:121", "raw": "  - id: control.orbit.binding\n    label: 旋转 Orbit\n    purpose: 设置基础交互行为\n    path: interaction.orbitBinding\n    tier: basic\n    type: object\n    panel: mouse-select+text\n    paths:\n      mouse.left: interaction.orbitBinding.mouse.left\n      mouse.middle: interaction.orbitBinding.mouse.middle\n      mouse.right: interaction.orbitBinding.mouse.right\n      keyboard: interaction.orbitBinding.keyboard\n    enum:\n      mouse: [none, click, dblclick, longpress, scroll]\n    default:\n      mouse:\n        left: longpress\n        middle: none\n        right: none\n      keyboard: 上下左右\n    recommended:\n      mouse:\n        left: longpress\n      keyboard: 上下左右\n    advanced: none\n    details: 详情.md"}, {"id": "control.zoom.binding", "label": "缩放 Zoom", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:148", "raw": "  - id: control.zoom.binding\n    label: 缩放 Zoom\n    purpose: 设置基础交互行为\n    path: interaction.zoomBinding\n    tier: basic\n    type: object\n    panel: mouse-select+text\n    paths:\n      mouse.left: interaction.zoomBinding.mouse.left\n      mouse.middle: interaction.zoomBinding.mouse.middle\n      mouse.right: interaction.zoomBinding.mouse.right\n      keyboard: interaction.zoomBinding.keyboard\n    enum:\n      mouse: [none, click, dblclick, longpress, scroll]\n    default:\n      mouse:\n        left: none\n        middle: click\n        right: none\n      keyboard: 放大+键，缩小-键\n    recommended:\n      mouse:\n        middle: click\n      keyboard: 放大+键，缩小-键\n    advanced: none\n    details: 详情.md"}, {"id": "control.restore.binding", "label": "复位 Restore", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:175", "raw": "  - id: control.restore.binding\n    label: 复位 Restore\n    purpose: 设置基础交互行为\n    path: interaction.restoreBinding\n    tier: basic\n    type: object\n    panel: mouse-select+text\n    paths:\n      mouse.left: interaction.restoreBinding.mouse.left\n      mouse.middle: interaction.restoreBinding.mouse.middle\n      mouse.right: interaction.restoreBinding.mouse.right\n      keyboard: interaction.restoreBinding.keyboard\n    enum:\n      mouse: [none, click, dblclick, longpress, scroll]\n    default:\n      mouse:\n        left: none\n        middle: none\n        right: none\n      keyboard: Space\n    recommended:\n      mouse:\n        left: none\n        middle: none\n        right: none\n      keyboard: Space\n    advanced: none\n    details: 详情.md"}, {"id": "control.interaction.origin", "label": "交互原点 Interaction Origin", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:204", "raw": "  - id: control.interaction.origin\n    label: 交互原点 Interaction Origin\n    purpose: 设置相机轴心\n    path: interaction.interactionOrigin\n    tier: basic\n    type: array\n    panel: multi-select\n    enum: [object, mouse]\n    labels:\n      object: 对象\n      mouse: 鼠标\n    default: [object]\n    recommended: [object]\n    recommendedNote: 场景+单物体\n    advanced: none\n    details: 详情.md"}, {"id": "control.orientation.tokenType", "label": "Token类型 Token Type", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:221", "raw": "  - id: control.orientation.tokenType\n    label: Token类型 Token Type\n    purpose: 设置方位Token组件辅助相机的交互\n    path: interaction.orientationToken.types\n    tier: basic\n    type: array\n    panel: single-select\n    enum: [none, axes, compass, heading]\n    labels:\n      none: 无\n      axes: 3D坐标\n      compass: 指北针\n      heading: 航向箭头\n    default: [axes]\n    domainDefaults:\n      算力中心: [axes]\n    recommendedNote: 普适 default 与算力中心模板同为 axes，是交集，不是另一套数\n    advanced: none\n    details: 详情.md\n    notes:\n      - \"方位token组件需要设计师基于产品具体需求来决定是否加入至设计中，产品如地图具有强导航属性，方位token则为必要UI控件；产品如芯片设计EDA，界面内3D对象都较为接近，无法一眼识别方位，则需要方位token的辅助；但部分监控类产品如能源发电厂，有较为明显的3D对象标识，方位token可以选择性省略。\"\n      - \"普适默认 axes：右下角圆标三轴（X #ff3653 / Y #8adb00 / Z #2c8fff，正向带字母，负向为同色较暗小圆点）。在坐标区域内拖动自由旋转视角，拖满一边约 180°，原点是选中物体或场景的包围盒几何中心；未拖动时点击 +X 右视、−X 左视、+Y 顶视、−Y 底视、+Z 正视、−Z 后视。实现见 bridge/axis-token.js。\""}, {"id": "control.orientation.tokenOrigin", "label": "Token原点 Token Origin", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:244", "raw": "  - id: control.orientation.tokenOrigin\n    label: Token原点 Token Origin\n    purpose: 设置方位Token组件辅助相机的交互\n    path: interaction.orientationToken.origin\n    tier: basic\n    type: object\n    panel: string-xyz\n    fields:\n      x: { type: float, default: 0, recommended: 0 }\n      y: { type: float, default: 0, recommended: 0 }\n      z: { type: float, default: 0, recommended: 0 }\n    default:\n      x: 0\n      y: 0\n      z: 0\n    recommended:\n      x: 0\n      y: 0\n      z: 0\n    advanced: none\n    details: 详情.md"}, {"id": "control.orientation.orthographicCamera", "label": "Token触发正交机位 Orthographic Camera", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:266", "raw": "  - id: control.orientation.orthographicCamera\n    label: Token触发正交机位 Orthographic Camera\n    purpose: 设置方位Token组件辅助相机的交互\n    path: interaction.orientationToken.orthographicCamera\n    tier: basic\n    type: boolean\n    panel: boolean\n    default: true\n    recommended: true\n    advanced: none\n    details: 详情.md"}, {"id": "control.orientation.orthographicCameraType", "label": "Token触发正交机位 Orthographic Camera Type", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:278", "raw": "  - id: control.orientation.orthographicCameraType\n    label: Token触发正交机位 Orthographic Camera Type\n    purpose: 设置方位Token组件辅助相机的交互\n    path: interaction.orientationToken.orthoViews\n    tier: advanced\n    type: array\n    panel: multi-select\n    basic: none\n    visibleWhen:\n      path: interaction.orientationToken.orthographicCamera\n      eq: true\n    enum: [front, back, left, right, top, bottom]\n    labels:\n      front: 正视图\n      back: 后视图\n      left: 左视图\n      right: 右视图\n      top: 顶视图\n      bottom: 底视图\n    default: [front, left, right, top]\n    recommended: [front, left, right, top]\n    details: 详情.md\n    notes:\n      - \"机位开关 On 时展示六标签；默认正/左/右/顶\""}, {"id": "control.orientation.orthoPositions", "label": "正交机位位置 Ortho Camera Positions", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:303", "raw": "  - id: control.orientation.orthoPositions\n    label: 正交机位位置 Ortho Camera Positions\n    purpose: 设置方位Token组件辅助相机的交互\n    path: interaction.orientationToken.orthoPositions\n    tier: advanced\n    type: object\n    fields:\n      - key: front.focalLengthMm\n        type: float\n        unit: mm\n        panel: number\n      - key: front.polarDeg\n        type: float\n        unit: deg\n        panel: number\n      - key: front.azimuthDeg\n        type: float\n        unit: deg\n        panel: number\n      - key: left.focalLengthMm\n        type: float\n        unit: mm\n        panel: number\n      - key: left.polarDeg\n        type: float\n        unit: deg\n        panel: number\n      - key: left.azimuthDeg\n        type: float\n        unit: deg\n        panel: number\n      - key: right.focalLengthMm\n        type: float\n        unit: mm\n        panel: number\n      - key: right.polarDeg\n        type: float\n        unit: deg\n        panel: number\n      - key: right.azimuthDeg\n        type: float\n        unit: deg\n        panel: number\n      - key: top.focalLengthMm\n        type: float\n        unit: mm\n        panel: number\n      - key: top.polarDeg\n        type: float\n        unit: deg\n        panel: number\n      - key: top.azimuthDeg\n        type: float\n        unit: deg\n        panel: number\n    basic: none\n    visibleWhen:\n      path: interaction.orientationToken.orthographicCamera\n      eq: true\n    details: 详情.md\n    notes:\n      - \"按正/左/右/顶视图分别写 focalLengthMm、polarDeg、azimuthDeg；面板页签切换绑定\"\n      - \"缺省跟随 Step1 焦距，俯仰/方位用各视图正交默认值\""}, {"id": "control.roam.firstPersonView", "label": "漫游模式 First Person View", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:367", "raw": "  - id: control.roam.firstPersonView\n    label: 漫游模式 First Person View\n    purpose: 设置漫游相机的细节参数\n    path: interaction.firstPersonView.enabled\n    tier: basic\n    type: boolean\n    panel: boolean\n    default: false\n    recommended: false\n    advanced: none\n    details: 详情.md"}, {"id": "control.roam.eyeLevelAdjustment", "label": "真实视野调整 Eye Level Adjustment", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:379", "raw": "  - id: control.roam.eyeLevelAdjustment\n    label: 真实视野调整 Eye Level Adjustment\n    purpose: 设置漫游相机的细节参数\n    path: interaction.firstPersonView.eyeLevelAdjustment\n    tier: basic\n    type: boolean\n    panel: boolean\n    visibleWhen:\n      path: interaction.firstPersonView.enabled\n      eq: true\n    default: true\n    recommended: true\n    advanced: none\n    details: 详情.md"}, {"id": "control.roam.eyeLevelValue", "label": "视野高度 Eye Level Value", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:394", "raw": "  - id: control.roam.eyeLevelValue\n    label: 视野高度 Eye Level Value\n    purpose: 设置漫游相机的细节参数\n    path: interaction.firstPersonView.eyeLevelM\n    tier: advanced\n    type: number\n    panel: slider+text\n    basic: none\n    unit: m\n    min: 1.5\n    max: 2\n    step: 0.01\n    visibleWhen:\n      path: interaction.firstPersonView.enabled\n      eq: true\n    default: 1.7\n    recommended: 1.7\n    advanced: slider+text\n    details: 详情.md"}, {"id": "control.roam.fieldOfViewHuman", "label": "视野焦距 Field of View-Human", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:414", "raw": "  - id: control.roam.fieldOfViewHuman\n    label: 视野焦距 Field of View-Human\n    purpose: 设置漫游相机的细节参数\n    path: interaction.firstPersonView.humanFocalLengthMm\n    tier: advanced\n    type: number\n    panel: slider+text\n    basic: none\n    unit: mm\n    min: 36\n    max: 50\n    step: 1\n    visibleWhen:\n      path: interaction.firstPersonView.enabled\n      eq: true\n    default: 36\n    recommended: 36\n    advanced: slider+text\n    details: 详情.md"}, {"id": "control.roam.autoRoam", "label": "自动漫游 Auto Roam", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:434", "raw": "  - id: control.roam.autoRoam\n    label: 自动漫游 Auto Roam\n    purpose: 设置漫游相机的细节参数\n    path: interaction.firstPersonView.autoRoam\n    tier: basic\n    type: boolean\n    panel: boolean\n    default: false\n    recommended: false\n    visibleWhen:\n      path: interaction.firstPersonView.enabled\n      eq: true\n    advanced: none\n    details: 详情.md\n    notes:\n      - \"场景漫游 On 时展示；开启后展开绕轨速率\""}, {"id": "control.roam.orbitRate", "label": "绕轨速率 Orbit Rate", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:451", "raw": "  - id: control.roam.orbitRate\n    label: 绕轨速率 Orbit Rate\n    purpose: 设置漫游相机的细节参数\n    path: interaction.firstPersonView.orbitRate\n    tier: advanced\n    type: number\n    panel: slider+text\n    basic: none\n    unit: x\n    min: 0.1\n    max: 10\n    step: 0.1\n    default: 1\n    recommended: 1\n    visibleWhen:\n      path: interaction.firstPersonView.autoRoam\n      eq: true\n    advanced: slider+text\n    details: 详情.md"}, {"id": "control.input.orbitAroundSelection", "label": "绕选中旋转", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:471", "raw": "  - id: control.input.orbitAroundSelection\n    label: 绕选中旋转\n    path: interaction.camera.orbitAroundSelection\n    tier: basic\n    type: boolean\n    default: true\n    agent: read_only"}, {"id": "control.pivot.orbitAroundSelection", "label": "选中旋转（select 块）", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:479", "raw": "  - id: control.pivot.orbitAroundSelection\n    label: 选中旋转（select 块）\n    path: select.orbitAroundSelection\n    tier: basic\n    type: boolean\n    default: true\n    agent: read_only"}, {"id": "control.camera.verticalFieldRange", "label": "垂直视角范围 Vertical Field Range", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:487", "raw": "  - id: control.camera.verticalFieldRange\n    label: 垂直视角范围 Vertical Field Range\n    purpose: 设置相机边缘限制\n    path: orbit\n    tier: basic\n    type: object\n    panel: slider+text-dual\n    paths:\n      min: orbit.verticalFieldRangeMinDeg\n      max: orbit.verticalFieldRangeMaxDeg\n    min: -90\n    max: 90\n    step: 0.5\n    default:\n      min: 0\n      max: 90\n    recommended:\n      min: 0\n      max: 90\n    advanced: none\n    details: 详情.md"}, {"id": "control.camera.horizontalFieldRange", "label": "水平视角范围 Horizontal Field Range", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:509", "raw": "  - id: control.camera.horizontalFieldRange\n    label: 水平视角范围 Horizontal Field Range\n    purpose: 设置相机边缘限制\n    path: orbit\n    tier: basic\n    type: object\n    panel: slider+text-dual\n    paths:\n      min: orbit.horizontalFieldRangeMinDeg\n      max: orbit.horizontalFieldRangeMaxDeg\n    min: -180\n    max: 180\n    step: 0.5\n    default:\n      min: -180\n      max: 180\n    recommended:\n      min: -180\n      max: 180\n    advanced: none\n    details: 详情.md"}, {"id": "control.camera.zoomRangeMode", "label": "缩放范围模式 Zoom Range Mode", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:531", "raw": "  - id: control.camera.zoomRangeMode\n    label: 缩放范围模式 Zoom Range Mode\n    purpose: 设置相机边缘限制\n    path: orbit.zoomRangeModes\n    tier: basic\n    type: array\n    panel: multi-select\n    enum: [multiplier, contentDataset]\n    labels:\n      multiplier: 倍数\n      contentDataset: 内容数据集\n    default: [contentDataset]\n    recommended: [contentDataset]\n    advanced: none\n    details: 详情.md"}, {"id": "control.camera.zoomRange", "label": "缩放范围 Zoom Range", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:547", "raw": "  - id: control.camera.zoomRange\n    label: 缩放范围 Zoom Range\n    purpose: 设置相机边缘限制\n    path: orbit\n    tier: advanced\n    type: object\n    panel: slider+text-dual\n    visibleWhen:\n      zoomRangeModesIncludes: multiplier\n    paths:\n      min: orbit.minDistance\n      max: orbit.maxDistance\n    min: 0.1\n    max: 5000\n    step: 0.1\n    default:\n      min: 0.1\n      max: 1000\n    recommended:\n      min: 0.1\n      max: 1000\n    advanced: slider+text-dual\n    details: 详情.md"}, {"id": "control.camera.dataLayerRange", "label": "数据集范围 Data Layer Range", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:571", "raw": "  - id: control.camera.dataLayerRange\n    label: 数据集范围 Data Layer Range\n    purpose: 设置相机边缘限制\n    path: render.dataLayer\n    tier: advanced\n    type: object\n    panel: slider+text-dual\n    visibleWhen:\n      zoomRangeModesIncludes: contentDataset\n    paths:\n      min: render.dataLayer.minLevelIndex\n      max: render.dataLayer.maxLevelIndex\n    min: 0\n    max: 43\n    step: 1\n    default:\n      min: 0\n      max: 43\n    domainDefaults:\n      算力中心: {min: 10, max: 27}\n    recommendedNote: 普适 0～43 包住算力中心模板 10～27\n    advanced: slider+text-dual\n    details: 详情.md"}, {"id": "control.sensitivity.panSpeed", "label": "拖动速度 Pan Speed", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:595", "raw": "  - id: control.sensitivity.panSpeed\n    label: 拖动速度 Pan Speed\n    purpose: 设置相机灵敏度\n    path: orbit.panSpeed\n    tier: basic\n    type: number\n    unit: ratio\n    panel: slider+text\n    min: 0.1\n    max: 10\n    step: 0.05\n    default: 1.0\n    recommended: 1.0\n    advanced: none\n    details: 详情.md"}, {"id": "control.sensitivity.rotateSpeed", "label": "旋转速度 Orbit Speed", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:611", "raw": "  - id: control.sensitivity.rotateSpeed\n    label: 旋转速度 Orbit Speed\n    purpose: 设置相机灵敏度\n    path: orbit.rotateSpeed\n    tier: basic\n    type: number\n    unit: ratio\n    panel: slider+text\n    min: 0.1\n    max: 10\n    step: 0.05\n    default: 1.0\n    recommended: 1.0\n    advanced: none\n    details: 详情.md"}, {"id": "control.sensitivity.zoomSpeed", "label": "缩放步长 Zoom Step", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:627", "raw": "  - id: control.sensitivity.zoomSpeed\n    label: 缩放步长 Zoom Step\n    purpose: 设置相机灵敏度\n    path: orbit.zoomSpeed\n    tier: basic\n    type: number\n    unit: ratio\n    panel: slider+text\n    min: 0.1\n    max: 10\n    step: 0.05\n    default: 1.0\n    recommended: 1.0\n    advanced: none\n    details: 详情.md"}, {"id": "control.adaptive.zoom.dynamicDataLayer", "label": "缩放触发模型内容数据集切换 Dynamic Data Layer", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:643", "raw": "  - id: control.adaptive.zoom.dynamicDataLayer\n    label: 缩放触发模型内容数据集切换 Dynamic Data Layer\n    purpose: 触发交互后，连带的周边自适应行为\n    path: interaction.adaptive.dynamicDataLayerOnZoom\n    tier: basic\n    type: boolean\n    panel: boolean\n    default: true\n    recommended: true\n    advanced: none\n    details: 详情.md"}, {"id": "control.sensitivity.dampingFactor", "label": "阻尼 Damping", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:655", "raw": "  - id: control.sensitivity.dampingFactor\n    label: 阻尼 Damping\n    purpose: 设置相机灵敏度\n    path: orbit.dampingFactor\n    tier: basic\n    type: number\n    unit: ratio\n    panel: slider+text\n    min: 0.1\n    max: 10\n    step: 0.05\n    default: 0.2\n    recommended: 0.2\n    domainDefaults:\n      芯片: 0.1\n    recommendedNote: 普适 min 仍是 0.1，本字段芯片取 0.1。引擎阻尼 0.06 只在芯片领域包 force.orbit，选中芯片模板时写入视口\n    advanced: none\n    details: 详情.md"}, {"id": "control.adaptive.keepFocusOnOrbit", "label": "旋转保持聚焦", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:674", "raw": "  - id: control.adaptive.keepFocusOnOrbit\n    label: 旋转保持聚焦\n    path: interaction.focus.keepFocusOnOrbit\n    tier: basic\n    type: boolean\n    default: true"}, {"id": "control.adaptive.select.duration", "label": "选中运镜时长 ms", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:681", "raw": "  - id: control.adaptive.select.duration\n    label: 选中运镜时长 ms\n    path: select.duration\n    tier: advanced\n    type: string\n    default: \"600\"\n    domainDefaults:\n      芯片: \"600\"\n    recommendedNote: 对齐 demo select.duration"}, {"id": "control.adaptive.select.angle", "label": "选中机位仰角", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:691", "raw": "  - id: control.adaptive.select.angle\n    label: 选中机位仰角\n    path: select.angle\n    tier: advanced\n    type: string\n    default: \"45\"\n    domainDefaults:\n      芯片: \"60\""}, {"id": "control.adaptive.select.focus", "label": "选中焦距 mm", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:700", "raw": "  - id: control.adaptive.select.focus\n    label: 选中焦距 mm\n    path: select.focus\n    tier: advanced\n    type: string\n    default: \"50\"\n    domainDefaults:\n      芯片: \"120\""}, {"id": "control.adaptive.select.origin", "label": "选中机位原点表达式", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:709", "raw": "  - id: control.adaptive.select.origin\n    label: 选中机位原点表达式\n    path: select.origin\n    tier: advanced\n    type: string\n    default: \"0,0,0\"\n    domainDefaults:\n      芯片: \"0,0,0.5*(object)\""}, {"id": "control.adaptive.select.motionCurve", "label": "选中运镜曲线", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:718", "raw": "  - id: control.adaptive.select.motionCurve\n    label: 选中运镜曲线\n    path: select.motionCurve\n    tier: advanced\n    type: string\n    default: \"0.2,0,0.1,1\"\n    domainDefaults:\n      芯片: \"0.2,0,0.1,1\""}, {"id": "control.adaptive.select.selectOpacity", "label": "选中对象不透明度", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:727", "raw": "  - id: control.adaptive.select.selectOpacity\n    label: 选中对象不透明度\n    path: select.selectOpacity\n    tier: advanced\n    type: string\n    default: \"1.0\"\n    domainDefaults:\n      芯片: \"1.0\""}, {"id": "control.adaptive.select.otherOpacity", "label": "选中时非聚焦不透明度", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:736", "raw": "  - id: control.adaptive.select.otherOpacity\n    label: 选中时非聚焦不透明度\n    path: select.otherOpacity\n    tier: advanced\n    type: string\n : "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:945", "raw": "  - id: control.adaptive.select.cameraMove\n    label: 选中触发相机移动 Camera Reposition After Select\n    purpose: 触发交互后，连带的周边自适应行为\n    path: interaction.adaptive.selectCamera\n    tier: basic\n    type: boolean\n    panel: boolean\n    default: false\n    recommended: false\n    advanced: none\n    details: 详情.md\n    notes:\n      - \"默认关闭：选中仅捕获旋转原点，不得自动框选、居中或运镜。开启后才可调 #1 相机 #2 周边透明 #3 描边\""}, {"id": "control.adaptive.select.cameraPosition", "label": "选中后相机位置 Camera Position - Select", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:959", "raw": "  - id: control.adaptive.select.cameraPosition\n    label: 选中后相机位置 Camera Position - Select\n    purpose: 触发交互后，连带的周边自适应行为\n    path: interaction.adaptive.selectReposition\n    tier: advanced\n    type: object\n    basic: none\n    visibleWhen:\n      path: interaction.adaptive.selectCamera\n      eq: true\n    fields:\n      - key: focalLengthMm\n        type: float\n        unit: mm\n        range: [18, 300]\n        recommended: inherit\n        derivedFrom: space.camera.focalLength\n      - key: polarDeg\n        type: float\n        unit: deg\n        range: [-90, 90]\n        recommended: inherit\n        derivedFrom: space.camera.verticalViewAngle\n      - key: azimuthDeg\n        type: float\n        unit: deg\n        range: [-180, 180]\n        recommended: inherit\n        derivedFrom: space.camera.horizontalViewAngle\n    details: 详情.md\n    notes:\n      - \"仅 selectCamera On 时展示。默认 Off：选中只更新旋转原点，不得自动框选或运镜。未改写时等于 Step 1 已提交的焦距、俯仰、方位。禁止再写 50/45/0\""}, {"id": "control.adaptive.select.transparencyChange", "label": "选中触发非聚焦物体透明度降低 Transparency Change - Select", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:992", "raw": "  - id: control.adaptive.select.transparencyChange\n    label: 选中触发非聚焦物体透明度降低 Transparency Change - Select\n    purpose: 触发交互后，连带的周边自适应行为\n    path: interaction.adaptive.selectReposition.dimOthers\n    tier: basic\n    type: boolean\n    panel: boolean\n    default: false\n    recommended: false\n    domainDefaults:\n      芯片: true\n    advanced: none\n    details: 详情.md\n    notes:\n      - \"#2 开关；数值见 transparencyValue\""}, {"id": "control.adaptive.select.transparencyValue", "label": "选中非聚焦物体透明度 Transparency Value - Select", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:1008", "raw": "  - id: control.adaptive.select.transparencyValue\n    label: 选中非聚焦物体透明度 Transparency Value - Select\n    purpose: 触发交互后，连带的周边自适应行为\n    path: interaction.adaptive.selectReposition.othersOpacityPct\n    tier: advanced\n    type: float\n    range: [0, 100]\n    unit: percent\n    default: 30\n    recommended: 30\n    domainDefaults:\n      芯片: 40\n    recommendedNote: 对齐 demo select.otherOpacity=0.4\n    visibleWhen:\n      path: interaction.adaptive.selectReposition.dimOthers\n      eq: true\n    details: 详情.md"}, {"id": "control.adaptive.select.highlightObject", "label": "选中聚焦物体描边 Highlight Object - Select", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:1026", "raw": "  - id: control.adaptive.select.highlightObject\n    label: 选中聚焦物体描边 Highlight Object - Select\n    purpose: 触发交互后，连带的周边自适应行为\n    path: interaction.adaptive.selectReposition.showOutline\n    tier: basic\n    type: boolean\n    panel: boolean\n    default: false\n    recommended: false\n    domainDefaults:\n      芯片: true\n    advanced: none\n    details: 详情.md\n    notes:\n      - \"#3 描边开关；颜色与粗细见 highlightEdge\""}, {"id": "control.adaptive.select.highlightEdge", "label": "选中聚焦物体边缘高亮 Highlight Object - Select", "group": "step-03-场景控制", "source": "step-03-场景控制/参数.yaml:1042", "raw": "  - id: control.adaptive.select.highlightEdge\n    label: 选中聚焦物体边缘高亮 Highlight Object - Select\n    purpose: 触发交互后，连带的周边自适应行为\n    path: interaction.adaptive.selectReposition\n    tier: advanced\n    type: object\n    basic: none\n    visibleWhen:\n      path: interaction.adaptive.selectReposition.showOutline\n      eq: true\n    fie 参数。来源：AIDC 对照表；数值均保留 AIDC 的深/浅主题差异。\n# seed 只放语义与量纲可安全映射到通用 Step 字段的参数。\nseed:\n  foundation.length: \"1:1m\"\n  foundation.gridMajorMm: 1000\n  foundation.focalLengthMm: 30\n  foundation.sensorHeightMm: 24\n  controls.polarDeg: 12.4\n  controls.azimuthDeg: 32.5\n  foundation.lightDecay: quadratic\n  foundation.shadowEnabled: true\n  ui.scale.activeScaleLevelId: L15\nlayersDefault: [camera, lighting, scale, length]\n\n# 下列值是 AIDC 原始 3D 参数，不会被错误转换成通用 field；由 GTS 宿主 Adapter 消费。\ngts3d:\n  unitAssumption: \"1 unit = 1 m\"\n  world:\n    ground: { size: [10000, 1, 10000], centerY: -0.5 }\n    roads: { width: 5.6, thickness: 0.06, length: 500, z: [-98, -34, 30, 94], x: [-118, -48, 22, 92] }\n    paving: { width: 1.5, thickness: 0.15, intersectionMargin: 4.25 }\n    floors: { count: 4, levelsY: [0, 3, 6, 9], floorHeight: 3, builtHeight: 12 }\n    buildings:\n      - { id: b1, center: [-19, 0], footprint: [32, 26], height: 12 }\n      - { id: b2, center: [55, 0], footprint: [38, 24], height: 12 }\n      - { id: b3, center: [-18, -66], footprint: [30, 28], height: 12 }\n      - { id: b4, center: [55, -66], footprint: [34, 27], height: 12 }\n      - { id: b5, center: [-87, 0], footprint: [32, 25], height: 12 }\n      - { id: b6, center: [-86, -66], footprint: [28, 30], height: 12 }\n      - { id: b7, center: [57, 64], footprint: [34, 23], height: 12 }\n      - { id: b8, center: [-86, 64], footprint: [26, 28], height: 12 }\n      - { id: b9, center: [126, 0], footprint: [31, 25], height: 12 }\n      - { id: b10, center: [126, -66], footprint: [31, 27], height: 12 }\n    lampPole: { height: 5, radius: [0.045, 0.075], spacing: 14 }\n  camera:\n    near: 0.5\n    far: 900\n    pixelRatioMax: 1.35\n    login: { distance: 122.9, lookAt: [12, 15, 0], zoom: 0.85, panX: 0, panY: 5, azimuthOffsetDeg: -2, azimuthBaseDeg: 34.5, elevationDeg: 12.4, fovDeg: 43, motion: 0.7, drift: 2 }\n    narrowViewportFovDeg: 58\n    backgroundView: { moveSpeed: 28, shiftMultiplier: 2, radius: [50, 240], pitchRad: [0.14, 1.3], targetBounds: { x: [-70, 90], z: [-80, 80], y: 15 }, exit: Esc, exitDurationMs: 800 }\n  lighting:\n    hemisphere: { sky: \"#d5e0ee\", ground: \"#596149\", dark: 0.7, light: 0 }\n    sun:\n      color: \"#f0f3fa\"\n      dark: { intensity: 4.3, azimuthDeg: -60, elevationDeg: 46, position: [-96.3, 115.1, 55.6] }\n      light: { intensity: 4.6, azimuthDeg: -56, elevationDeg: 37, position: [-105.9, 96.3, 71.5] }\n    rim: { color: \"#d8dfe9\", intensity: 0, position: [50, 35, -60] }\n    energyPoint: { position: [22, 1.6, -34], decay: 2, distance: 16, baseIntensity: 8, amplitude: 2, frequency: 0.5 }\n    coolingPoints: { count: 3, decay: 2, distance: 16, baseIntensity: 5, amplitude: 1.2, frequency: 0.4, color: \"#b9d8e4\" }\n    environmentReflection:\n      type: PMREM\n      background: \"#303033\"\n      panels: [{ position: [-30, 30, 0], size: [1, 50, 80] }, { position: [0, 65, 0], size: [100, 1, 35] }, { position: [60, 20, -45], size: [1, 30, 100] }]\n    toneMapping: ACESFilmic\n    exposure: { dark: 0.6, light: 0.95 }\n    emissive:\n      buildingLight: { darkOpacity: 0.0216, lightBaseOpacity: 0.135, lightPeakOpacity: 0.2475 }\n      glass: { dark: 0.16, light: [0.12, 0.27] }\n      blendMode: { dark: AdditiveBlending, light: NormalBlending }\n      energyStrength: { dark: 2, light: 2 }\n      coolingLight: { dark: 0.55, light: 0.8 }\n      lampBrightness: { dark: 0.45, light: 2 }\n      glow: { dark: 0, light: 0.031 }\n      sensorOpacity: { dark: 0, light: 0 }\n      edgeOpacity: { dark: 0, light: 1 }\n  shadow:\n    dark: { strength: 0.75, radius: 2, normalBias: 0.12 }\n    light: { strength: 1, radius: 6, normalBias: 0 }\n    map: { size: 2048, type: PCF, bias: -0.0002 }\n    camera: { left: -150, right: 150, top: 150, bottom: -150, near: 1, far: 300 }\n  atmosphere:\n    dark: { sky: \"#313235\", fog: [260, 750], horizon: [300, 450], dof: { enabled: true, autoFocus: true, focusDistance: 120, focusRange: 75, softness: 67, blur: 0.5, near: 0.8, far: 1.4 } }\n    light: { sky: \"#edf0f2\", fog: [600, 1200], horizon: [600, 750], dof: { enabled: true, autoFocus: true, focusDistance: 500, focusRange: 154, softness: 213, blur: 2.5, near: 0, far: 1.35 } }\n  materials:\n    structure: { dark: { roughness: 0.78, metalness: 0.05, opacity: 1, transmission: 0 }, light: { roughness: 1, metalness: 0.11, opacity: 0.78, transmission: 0.27 }, thickness: 1.2, ior: 1.45 }\n    glass: { dark: { opacity: 0.94, roughness: 0.25, transmission: 0.05 }, light: { opacity: 0.92, roughness: 0.64, transmission: 0.05 }, thickness: 0.3, metalness: 0.25, ior: 1.45 }\n    auxiliary: { darkRoughness: 0, lightRoughness: 1 }\n    fixed: { groundRoughness: 0.96, roadRoughness: 0.87, pavingRoughness: 0.9, waterRoughness: 0.12, waterMetalness: 0.45 }\n  palette:\n    dark: { mountain: \"#262626\", ground: \"#222326\", road: \"#919191\", walk: \"#a8a8a8\", wall: \"#565758\", trim: \"#4f4f4f\", auxiliary: \"#9c9c9c\", roofCooling: \"#303a43\", roofFans: \"#7a858f\", roofPanels: \"#28323c\", plant: \"#3b5443\", glass: \"#367eab\", buildingLight: \"#3b6f97\", sensor: \"#ff0000\", lamp: \"#ffdd00\", energyBase: \"#33754b\", energy: \"#00fe87\", air: \"#ffffff\", water: \"#00bfff\", scan: \"#3794cd\" }\n    light: { mountain: \"#bac4ca\", ground: \"#d5d9dc\", road: \"#b2bbc0\", walk: \"#e0e4e6\", wall: \"#dce2e6\", trim: \"#3e4b55\", auxiliary: \"#819098\", roofCooling: \"#585b5f\", roofFans: \"#8bb5bb\", roofPanels: \"#585b5f\", plant: \"#536c55\", glass: \"#367eab\", buildingLight: \"#304b5d\", sensor: \"#ff0000\", lamp: \"#ddd59c\", energyBase: \"#788b80\", energy: \"#29986b\", air: \"#ffffff\", water: \"#00bfff\", scan: \"#5fCAFF\" }\n    scanAlpha: { dark: 0.35, light: 1 }\n  animation:\n    speed: 2\n    flowSpeed: 2.8\n    coolingSpeed: 0.8\n    fanSpeed: 1.6\n    energyStyle: 0\n    coolingStyle: 5\n    scanStyle: 0\n    scan: { strength: 0.45, periodSec: 9.5, width: 0.4 }\n    breath: { darkEnabled: false, lightEnabled: true, periodSec: 7.5, strength: 0.15 }\n"}, {"id": "domains/gts/rules.yaml", "label": "rules", "group": "领域配置", "source": "domains/gts/rules.yaml", "raw": "constraints:\n  - id: meter-world-units\n    require: foundation.length == \"1:1m\"\n  - id: preserve-aidc-camera-semantics\n    note: AIDC zoom 是 PerspectiveCamera.zoom；不得映射为 orbit.minDistance。\n  - id: preserve-aidc-exposure-semantics\n    note: AIDC exposure 是 tone-mapping；不得映射为 foundation.lightingExposure。\n  - id: background-view-is-not-first-person\n    note: AIDC 背景查看移动观察目标，不具备人眼高度和碰撞，不得映射为真实漫游。\nalarms:\n  - id: campus-energy-flow\n    channel: energy.flow\n    severity: warning\n    threshold: { lte: 0, unit: ratio }\n  - id: cooling-flow\n    channel: cooling.airflow\n    severity: warning\n    threshold: { lte: 0, unit: ratio }\n"}, {"id": "domains/gts/ui-layout.yaml", "label": "ui-layout", "group": "领域配置", "source": "domains/gts/ui-layout.yaml", "raw": "panelHints:\n  preferGroups: [空间尺寸与单位, 观察视角, 模型光源, 渲染机制]\n  lockCameraTier: keep\n  themeModes: [dark, light]\npermissions:\n  applyProfileRequiresConfirm: true\n  visualizationLayerOptIn: true\n"}, {"id": "domains/semiconductor/asset-schema.yaml", "label": "asset-schema", "group": "领域配置", "source": "domains/semiconductor/asset-schema.yaml", "raw": "assetTypes:\n  - id: semiconductor.package\n    label: 封装\n    parent: null\n  - id: semiconductor.die\n    label: Die\n    parent: semiconductor.package\n  - id: semiconductor.layer\n    label: 工艺层\n    parent: semiconductor.die\n  - id: semiconductor.bond\n    label: 键合\n    parent: semiconductor.package\nrelations:\n  - package → die[] → layer[]\nrequiredOnPickable: [assetId, assetType, modelNodeId, semanticRole]\nsemanticRoles: [package, die, metal, poly, via, bond, substrate]\nlegacyMap:\n  matRole: semanticRole\n  matClass: assetTypeHint\n"}, {"id": "domains/semiconductor/data-schema.yaml", "label": "data-schema", "group": "领域配置", "source": "domains/semiconductor/data-schema.yaml", "raw": "points:\n  - id: temperature\n    unit: C\n    range: [-40, 150]\n  - id: timing.slack\n    unit: ns\n  - id: yield\n    unit: percent\n    range: [0, 100]\nqualityCodes: [good, uncertain, bad, stale]\nclockModes: [realtime, history, simulation, paused]\n"}, {"id": "domains/semiconductor/manifest.yaml", "label": "manifest", "group": "领域配置", "source": "domains/semiconductor/manifest.yaml", "raw": "id: semiconductor\nversion: 1.0.0\nlabel: 芯片\nprojectDomains: [semiconductor, 芯片]\ntemplateIds: [chip]\nextends: [common]\ninteractionProfile: chipInspection\ncameraTier: chip\nemptyScaleLevel: L27\nlegacyPackage: 领域/芯片默认参数包.yaml\ncapabilities:\n  - chip-camera\n  - explode-layers\n  - die-package-semantics\n  - thermal-visual-hooks\n"}, {"id": "domains/semiconductor/presets.yaml", "label": "presets", "group": "领域配置", "source": "domains/semiconductor/presets.yaml", "raw": "# 芯片场景预设（与 domainDefaults / 芯片默认参数包 seed 对齐的最小集）\nseed:\n  foundation.length: \"1:1cm\"\n  foundation.gridMajorMm: 10\n  ui.scale.activeScaleLevelId: L27\n  foundation.focalLengthMm: 80\n  foundation.sensorHeightMm: 24\n  controls.polarDeg: 15\n  controls.azimuthDeg: 0\n  foundation.shadowEnabled: false\n  foundation.background: \"#000000\"\n  foundation.envMapIntensity: 0.06\n# Step4 默认不自动应用；显式 visualization layer 时可用\nvisualizationSeed:\n  ui.explodeGap: 8\n  ui.explodeGapUnit: mm\nlayersDefault: [camera, lighting, scale, length]\nlegacySeedFile: 领域/芯片默认参数包.yaml\n# 灯光灯具、业务示意图、点选层级、键位和引擎阻尼在领域包 force，不写进普适 min/default\nforceOnTemplate: chip\n"}, {"id": "domains/semiconductor/rules.yaml", "label": "rules", "group": "领域配置", "source": "domains/semiconductor/rules.yaml", "raw": "constraints:\n  - id: chip-camera-baseline\n    paths:\n      foundation.focalLengthMm: 80\n      controls.polarDeg: 15\n      controls.azimuthDeg: 0\n    on: restoreProfileDefaults\n  - id: explode-requires-layers\n    when: { path: ui.exploded, eq: true }\n    require:\n      - model.explosionCapability.enabled\n      - model.explosionCapability.layerCount.gte: 2\n      - ui.explodeGap.gt: 0\n  - id: bbox-must-not-downgrade\n    note: 已生效 semiconductor profile 不被 800mm 展示尺度降级\nalarms:\n  - id: thermal-hotspot\n    channel: temperature\n    severity: warning\n    threshold: { gte: 95, unit: C }\n"}, {"id": "domains/semiconductor/ui-layout.yaml", "label": "ui-layout", "group": "领域配置", "source": "domains/semiconductor/ui-layout.yaml", "raw": "panelHints:\n  preferGroups: [观察视角, 模型光源, 爆炸图视图, 模型间的距离, 切剖图]\n  lockCameraTier: chip\npermissions:\n  applyProfileRequiresConfirm: true\n  visualizationLayerOptIn: true\n"}, {"id": "领域/芯片默认参数包.yaml", "label": "芯片默认参数包", "group": "领域配置", "source": "领域/芯片默认参数包.yaml", "raw": "# 芯片领域默认参数包（全量对照路径检查 demo 3D）\n# 说明：同目录 芯片领域参数.md\n# 源：projects/chip-twin-demo-v1.01（亦可对照 路径检查demo + 3d-source）\n# 写入：面板选「芯片」→ writeTemplateSeedFields + domainDefaults + CHIP_ENGINE_EXTRAS\n# 反哺：demo「生效/导出领域包」→ chip-domain-feed JSON → scripts/feed-chip-domain-pack.mjs\n#\n# 分层：\n#   seed          → 进 twinState（合法范围内的产品参数）\n#   engineExtras  → 引擎 API 形（select/selectFocus/section/threshold），宿主按 path 消费\n#   force         → 只属于芯片。不改普适 min/max/default。点「领域场景模板-芯片」时强制写入并生效\n#   geometry      → 建模尺寸目录（只登记，禁止面板改顶点；modelScale 铁律=1）\n#   omit          → 有意不写入普适字段（铁律冲突）。引擎原值改放 force，不放宽普适范围\n#\n# 约束：以 demo 为基准改芯片点值；不改普适 default/min/max；不污染非芯片参数。\n\ndomain: 芯片\ntemplateId: chip\ncameraTier: chip\nemptyScaleLevel: L27\n\nomit:\n  foundation.modelScale: { demo: 1.2, keep: 1, reason: Step2 铁律，禁止写入 1.2 }\n  orbit.dampingFactor_demo: { demo: 0.06, keep: 0.1, reason: 普适 min=0.1 不动。面板字段仍取 0.1；引擎阻尼 0.06 只在 force.orbit }\n  \"*Event / mouseEvent / keyEvent\": { reason: 函数体不进点值。触发条件改写成 force.interactionRules 数据 }\n\n# —— Step 写入点（与参数.yaml domainDefaults / recommended.chip 对齐）——\nseed:\n  foundation.length: \"1:1cm\"\n  foundation.gridMajorMm: 10\n  foundation.gridSubdivisions: 1\n  ui.scale.activeScaleLevelId: L27\n  foundation.focalLengthMm: 80\n  foundation.fov: 17.06\n  foundation.near: 0.01\n  foundation.sensorMm: [36, 24]\n  controls.polarDeg: 15\n  controls.azimuthDeg: 0\n  foundation.globalBrightness: 1.0\n  foundation.lightingMode: threePoint\n  foundation.lightContrast: low\n  foundation.lightingTypes: [directional, area, environment]\n  foundation.lightingIntensity: { directional: 8, area: 8, environment: 16 }\n  foundation.lightingTemperature: { directional: 6500, area: 6500, environment: 4200 }\n  foundation.lightingColorHsv: { directional: \"0-0-100\", area: \"0-0-100\", environment: \"0-0-100\" }\n  foundation.lightingExposure: { directional: 0, area: 0, environment: 0 }\n  foundation.keyIntensity: 8\n  foundation.keyColor: \"#FFFFFF\"\n  foundation.keyTemperatureK: 6500\n  foundation.keyAzimuthDeg: [-85, -30]\n  foundation.keyElevationDeg: 30\n  foundation.shadowEnabled: false\n  foundation.background: \"#000000\"\n  foundation.uiBackground: \"#2B2B2B\"\n  foundation.environmentIntensity: 0.028\n  foundation.envMapIntensity: 0.06\n  foundation.toneMapping: ACESFilmic\n  foundation.workingSpace: ACEScg\n  foundation.viewTransform: \"ACES 1.0 SDR-video\"\n  foundation.reflective: { metalness: 0.08, roughness: 0.78 }\n  foundation.transparent: { ior: 2, roughness: 0.72 }\n  foundation.scaleLodMode: step\n  foundation.scaleAdaptGrid: false\n  foundation.motionBezier: \"0.2,0,0.1,1\"\n  foundation.motionCurve: \"cubic-bezier(0.2,0,0.1,1)\"\n  render.occlusion.strategy: perspective\n  render.occlusion.blockageTransparency: 30\n  orbit.dampingFactor: 0.1\n  orbit.panSpeed: 1.0\n  orbit.rotateSpeed: 1.0\n  orbit.zoomSpeed: 1.0\n  orbit.minDistance: 0.1\n  orbit.maxDistance: 400\n  orbit.verticalFieldRangeMinDeg: 0\n  orbit.verticalFieldRangeMaxDeg: 90\n  select.orbitAroundSelection: true\n  interaction.camera.orbitAroundSelection: true\n  select.duration: \"600\"\n  selectFocus.focusView: \"67\"\n  selectFocus.focusAngle: \"15\"\n  selectFocus.duration: \"750\"\n  selectFocus.hideOtherMesh: true\n  selectFocus.relocateTarget: true\n  interaction.adaptive.selectReposition.othersOpa
